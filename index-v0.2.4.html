<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Tally</title>
<style>
  html, body { margin: 0; width: 240px; height: 282px; overflow: hidden;
               background: #000; color: #fff; font: 14px system-ui, sans-serif;
               -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  #app { position: absolute; left: 50%; top: 50%; box-sizing: border-box;
         width: 240px; height: 282px; transform: translate(-50%, -50%) rotate(0deg);
         transition: transform .2s ease-out;
         display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 8px; }
  #label { font-size: 16px; letter-spacing: 2px; text-transform: uppercase;
           color: #FE5000; opacity: .9; }
  #count { font-size: 96px; line-height: 1.1; font-weight: 700; color: #fff;
           font-variant-numeric: tabular-nums; will-change: transform; }
  #count.pop { animation: pop .15s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #flash { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
           background: #FE5000; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  #ver { position: absolute; bottom: 6px; left: 0; width: 100%; text-align: center;
         font-size: 11px; opacity: .45; }
</style>
</head>
<body>
<div id="app">
  <div id="label">Kaffee</div>
  <div id="count">0</div>
  <div id="flash"></div>
  <div id="ver"></div>
</div>
<script>
const APP_VERSION = '0.2.4';
const KEY = 'tally_de_state';
const $ = (id) => document.getElementById(id);
const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s))));

let count = 0;
let dirty = false;
let mode = '-';   // shown in the version tag for on-device debugging

// Storage: creationStorage.plain (may be injected late), mirrored to localStorage
const cs = () => (window.creationStorage && window.creationStorage.plain) || null;
const unwrap = (raw) => {
  if (raw && typeof raw === 'object') raw = raw.value !== undefined ? raw.value : null;
  return typeof raw === 'string' && raw ? dec(raw) : null;
};
const store = {
  async get() {
    for (let i = 0; i < 15 && !cs(); i++) await new Promise((r) => setTimeout(r, 100));
    let v = null;
    try { if (cs()) { v = unwrap(await cs().getItem(KEY)); if (v) mode = 'cs'; } } catch (e) {}
    if (!v) { try { v = unwrap(localStorage.getItem(KEY)); if (v) mode = 'ls'; } catch (e) {} }
    if (!v) mode = cs() ? 'cs0' : 'ls0';
    return v;
  },
  async set(v) {
    const e = enc(v);
    try { localStorage.setItem(KEY, e); } catch (x) {}
    try { if (cs()) await cs().setItem(KEY, e); } catch (x) {}
  }
};

let saveTimer = null;
function flush() { clearTimeout(saveTimer); saveTimer = null; store.set({ count }); }
function scheduleSave() {
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
}
window.addEventListener('pagehide', () => { if (saveTimer) flush(); });
document.addEventListener('visibilitychange', () => { if (saveTimer) flush(); });

function restart(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function render(animate) {
  $('count').textContent = String(count);
  if (animate) restart($('count'), 'pop');
}

function change(delta) {
  const next = Math.max(0, count + delta);
  if (next === count) return;
  count = next;
  render(true);
  scheduleSave();
}

function reset() {
  count = 0;
  render(false);
  restart($('flash'), 'on');
  scheduleSave();
}

window.addEventListener('scrollUp',   () => change(1));
window.addEventListener('scrollDown', () => change(-1));
window.addEventListener('sideClick',  () => change(1));
window.addEventListener('longPressStart', reset);
document.body.addEventListener('touchstart', (e) => {
  e.preventDefault();
  change(1);
}, { passive: false });

// Desktop preview shim (no-op on the device)
if (typeof PluginMessageHandler === 'undefined') {
  window.addEventListener('keydown', (e) => {
    if (e.key === 'o') { setRot(rot + 90); return; }   // preview: cycle rotation
    const map = { ArrowUp: 'scrollUp', ArrowDown: 'scrollDown', Enter: 'sideClick', r: 'longPressStart', R: 'longPressStart' };
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
  });
}

// Auto-rotation: the WebView stays 240x282 portrait, so when the accelerometer
// says the device is held sideways/upside down, rotate #app (counter-rotated, with
// swapped width/height for 90/270) so the content reads upright.
const ORIENT_DIR = 1;      // set to -1 if the content turns the wrong way on the device
let refAng = null;         // calibrated on the first reading, so axis signs on the R1 do not matter
let rot = 0;               // current CSS rotation in degrees: 0, 90, 180, 270
let pending = null, pendingSince = 0;
let acc = 0;               // unwrapped CSS angle, so the turn always takes the short way round
function setRot(deg) {
  const next = ((deg % 360) + 360) % 360;
  acc += ((next - rot + 540) % 360) - 180;     // shortest signed step (-180..180)
  rot = next;
  const sideways = rot === 90 || rot === 270;
  const app = $('app');
  app.style.width = (sideways ? 282 : 240) + 'px';
  app.style.height = (sideways ? 240 : 282) + 'px';
  app.style.transform = 'translate(-50%, -50%) rotate(' + acc + 'deg)';
}
function onAccel(d) {
  const x = d.tiltX ?? d.x ?? d.rawX ?? 0, y = d.tiltY ?? d.y ?? d.rawY ?? 0;
  if (Math.hypot(x, y) < 0.5) return;                 // lying flat: keep current
  const ang = Math.atan2(x, y) * 180 / Math.PI;       // direction of gravity in the screen plane
  if (refAng === null) refAng = ang;                  // first stable reading = the way the card was opened (upright)
  const want = -ORIENT_DIR * (ang - refAng);          // device turned clockwise (x>0 on the R1) -> content turns counter-clockwise
  const target = ((Math.round(want / 90) * 90) % 360 + 360) % 360;
  const off = Math.abs(((want - rot) % 360 + 540) % 360 - 180);
  if (target === rot || off < 60) { pending = null; return; }   // hysteresis
  const now = Date.now();
  if (pending !== target) { pending = target; pendingSince = now; return; }
  if (now - pendingSince > 400) { setRot(target); pending = null; }
}
let sstat = 'wait';   // sensor status shown in the tag: wait / none / unavail / on / data / dm
let gotData = false, dmOn = false;
function feed(d) { gotData = true; if (sstat !== 'dm') sstat = 'data'; onAccel(d); }
function startMotionFallback() {
  if (dmOn) return;
  dmOn = true; sstat = 'dm';
  window.addEventListener('devicemotion', (e) => {
    const g = e.accelerationIncludingGravity;
    if (g && g.x != null && g.y != null) feed({ x: g.x, y: g.y });
  });
}
async function startOrientation() {
  try {
    for (let i = 0; i < 30 && !(window.creationSensors && window.creationSensors.accelerometer); i++)
      await new Promise((r) => setTimeout(r, 100));
    const sens = window.creationSensors && window.creationSensors.accelerometer;
    if (!sens) { sstat = 'none'; startMotionFallback(); return; }
    let ok = true;
    try { if (sens.isAvailable) ok = await sens.isAvailable(); } catch (e) {}
    if (!ok) { sstat = 'unavail'; startMotionFallback(); return; }
    sens.start((d) => { if (d) feed(d); }, { frequency: 10 });
    sstat = 'on';
    setTimeout(() => { if (!gotData) startMotionFallback(); }, 2500);
  } catch (e) { sstat = 'err'; startMotionFallback(); }
}
$('ver').textContent = 'v' + APP_VERSION;
render(false);
startOrientation();
store.get().then((st) => {
  if (st && Number.isInteger(st.count) && st.count >= 0 && !dirty) { count = st.count; render(false); }
});
</script>
</body>
</html>
