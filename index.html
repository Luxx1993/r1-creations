<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Claude Start</title>
<style>
  :root { --bg:#15171c; --fg:#f1efe9; --card:#232730; --card-focus:#2f3542; --accent:#7fb7a4; --muted:#8b909c; --bad:#e08a7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:240px; height:282px; overflow-x:hidden; overflow-y:auto; background:var(--bg); color:var(--fg);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { padding:8px 10px 30px; }
  h1 { margin:0 0 8px; font-size:15px; font-weight:600; color:var(--muted); }
  a { display:block; position:relative; margin-bottom:8px; padding:11px 36px 11px 14px; background:var(--card); color:var(--fg);
      text-decoration:none; font-size:19px; font-weight:600; border-left:5px solid transparent; border-radius:6px;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; -webkit-user-select:none; user-select:none; }
  a.focus { background:var(--card-focus); border-left-color:var(--accent); }
  small { display:block; margin-top:2px; font-size:12px; font-weight:400; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  .mark { position:absolute; right:10px; top:10px; font-size:20px; color:var(--muted); }
  .mark.ok { color:var(--accent); } .mark.bad { color:var(--bad); }
  #msg { position:fixed; left:10px; right:10px; bottom:18px; padding:6px 8px; background:#000; border:1px solid var(--accent);
         border-radius:6px; font-size:12px; display:none; }
  #ver { position:fixed; right:8px; bottom:4px; font-size:10px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Claude · <span id="hint">hold button: mark</span></h1>
  <div id="list"></div>
</main>
<div id="msg"></div>
<div id="ver"></div>
<script src="links.js?v=1.6.0"></script>
<script>
  const APP_VERSION = "1.6.0";
  const KEY = "claudestart-en.state.v1";           // Namespace: gemeinsamer Origin
  const MARKS = ["", "ok", "bad"], SYMBOL = { "": "○", ok: "✓", bad: "✗" };
  const LINKS = window.LINKS || [];
  let state = { marks: {}, opened: {} };
  let index = 0, els = [], order = [];

  // ---- Speicher: creationStorage (Base64) wenn vorhanden, localStorage als Rückfall ----
  const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s))));
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    try { if (window.creationStorage) window.creationStorage.plain.setItem(KEY, enc(state)); } catch (e) {}
  }
  async function load() {
    try { const s = localStorage.getItem(KEY); if (s) state = JSON.parse(s); } catch (e) {}
    for (let i = 0; i < 30 && !window.creationStorage; i++) await new Promise((r) => setTimeout(r, 100));
    try {
      if (window.creationStorage) {
        const raw = await window.creationStorage.plain.getItem(KEY);
        if (raw) state = dec(raw);
      }
    } catch (e) {}
    state.marks = state.marks || {}; state.opened = state.opened || {};
  }

  // ---- Anzeige ----
  function sorted() {   // zuletzt geöffnet zuerst, Rest in Reihenfolge der Datei
    return LINKS.map((l, n) => ({ l, n })).sort((a, b) => {
      const ta = state.opened[a.l.url] || 0, tb = state.opened[b.l.url] || 0;
      return tb - ta || a.n - b.n;
    }).map((x) => x.l);
  }
  function render(keepUrl) {
    order = sorted();
    const list = document.getElementById("list");
    list.textContent = "";
    els = order.map((l) => {
      const a = document.createElement("a");
      a.href = l.url;
      a.appendChild(document.createTextNode(l.title));
      const s = document.createElement("small"); s.textContent = l.note || ""; a.appendChild(s);
      const m = document.createElement("span"); const k = state.marks[l.url] || "";
      m.className = "mark " + k; m.textContent = SYMBOL[k]; a.appendChild(m);
      list.appendChild(a);
      return a;
    });
    const at = keepUrl ? order.findIndex((l) => l.url === keepUrl) : 0;
    select(at < 0 ? 0 : at);
  }
  function select(i) {
    if (!els.length) return;
    index = (i + els.length) % els.length;
    els.forEach((e, n) => e.classList.toggle("focus", n === index));
    els[index].scrollIntoView({ block: "nearest" });
  }
  function toast(t) {
    const m = document.getElementById("msg"); m.textContent = t; m.style.display = "block";
    setTimeout(() => { m.style.display = "none"; }, 2500);
  }

  // ---- Aktionen ----
  function open(i) {
    const l = order[i];
    if (!l) return;
    if (l.url.indexOf("<") >= 0) { toast("Add the address in links.js first"); return; }
    state.opened[l.url] = Date.now(); save();
    location.href = l.url;
  }
  function cycle(i) {
    const l = order[i]; if (!l) return;
    const k = state.marks[l.url] || "";
    const next = MARKS[(MARKS.indexOf(k) + 1) % MARKS.length];
    if (next) state.marks[l.url] = next; else delete state.marks[l.url];
    save();
    const m = els[i].querySelector(".mark"); m.className = "mark " + next; m.textContent = SYMBOL[next];
    toast({ "": "untested ○", ok: "works ✓", bad: "white/black/error ✗" }[next]);
  }

  // Drehregler und Seitentaste (Seitentaste lang: markieren)
  window.addEventListener("scrollUp", () => select(index - 1));
  window.addEventListener("scrollDown", () => select(index + 1));
  let held = false;
  window.addEventListener("longPressStart", () => { held = true; cycle(index); });
  window.addEventListener("sideClick", () => { if (held) { held = false; return; } open(index); });
  window.addEventListener("longPressEnd", () => { setTimeout(() => { held = false; }, 300); });

  // Berührung: Tippen öffnet (normales <a>), langes Tippen markiert. Kein preventDefault bei pointer-Ereignissen.
  let pressTimer = null, longDone = false, startY = 0;
  document.addEventListener("pointerdown", (e) => {
    const a = e.target.closest && e.target.closest("a"); if (!a) return;
    const n = els.indexOf(a); if (n < 0) return;
    select(n); longDone = false; startY = e.clientY;
    pressTimer = setTimeout(() => { longDone = true; cycle(n); }, 700);
  });
  const stop = () => { clearTimeout(pressTimer); };
  document.addEventListener("pointerup", stop);
  document.addEventListener("pointercancel", stop);
  document.addEventListener("pointermove", (e) => { if (Math.abs(e.clientY - startY) > 8) stop(); });
  document.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a"); if (!a) return;
    e.preventDefault();                       // Navigation steuert open()
    if (longDone) { longDone = false; return; }
    open(els.indexOf(a));
  });

  // Vorschau am Computer
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") select(index - 1);
    if (e.key === "ArrowDown") select(index + 1);
    if (e.key === "Enter") open(index);
    if (e.key === "m") cycle(index);
  });

  document.getElementById("ver").textContent = "v" + APP_VERSION;
  render();
  load().then(() => render());
</script>
</body>
</html>
