<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>clau.de</title>
<style>
  html, body { margin: 0; width: 240px; height: 282px; overflow: hidden; background: #000; color: #fff;
               font: 14px system-ui, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
  #app { position: relative; box-sizing: border-box; width: 240px; height: 282px; padding: 40px 8px 6px; }
  h1 { margin: 0 0 6px; font-size: 15px; color: #d97757; font-weight: 600; }
  #list .it { height: 34px; line-height: 34px; padding: 0 10px; border-radius: 8px; font-size: 15px;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .it.sel { background: #d97757; color: #000; font-weight: 600; }
  #ans { height: 196px; overflow: hidden; font-size: 14px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
  #ansin { transition: transform .1s; will-change: transform; }
  #hint { position: absolute; left: 8px; right: 8px; bottom: 16px; font-size: 10px; opacity: .55; text-align: center; }
  #ver { position: absolute; right: 8px; bottom: 3px; font-size: 9px; opacity: .4; }
  .hide { display: none; }
  .dots::after { content: ''; animation: d 1s steps(4) infinite; }
  @keyframes d { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
</style>
</head>
<body>
<div id="app">
  <h1 id="title">clau.de</h1>
  <div id="list"></div>
  <div id="ans" class="hide"><div id="ansin"></div></div>
  <div id="hint"></div>
  <div id="ver"></div>
</div>
<script>
const APP_VERSION = '0.1.0';
const $ = (id) => document.getElementById(id);
const PROMPTS = [
  ['Fakt des Tages', 'Nenne mir einen überraschenden Fakt.'],
  ['Witz', 'Erzähl mir einen kurzen Witz.'],
  ['Ideen', 'Gib mir 3 Ideen, was ich heute Abend machen könnte.'],
  ['Rezept', 'Schlag mir ein schnelles Gericht für 2 Personen vor, mit Zutaten.'],
  ['Quizfrage', 'Stell mir eine Quizfrage und gib die Antwort am Ende.'],
  ['Wort erklärt', 'Erkläre mir ein zufälliges, interessantes Wort.'],
  ['Motivation', 'Sag mir einen motivierenden Satz.']
];
const SUFFIX = ' Antworte auf Deutsch, maximal 60 Wörter, ohne Markdown.';
let sel = 0, mode = 'menu', scroll = 0, last = -1, waiting = false, timer = null;

function render() {
  $('title').textContent = mode === 'menu' ? 'clau.de' : PROMPTS[last][0];
  $('list').classList.toggle('hide', mode !== 'menu');
  $('ans').classList.toggle('hide', mode === 'menu');
  if (mode === 'menu') {
    // window of 5 items around the selection
    const start = Math.max(0, Math.min(sel - 2, PROMPTS.length - 5));
    $('list').innerHTML = PROMPTS.slice(start, start + 5).map((p, i) =>
      `<div class="it${start + i === sel ? ' sel' : ''}">${p[0]}</div>`).join('');
    $('hint').textContent = 'Rad: wählen · Taste: fragen';
  } else {
    $('ansin').style.transform = `translateY(${-scroll}px)`;
    $('hint').textContent = waiting ? '' : 'Rad: blättern · Taste: zurück · halten: neu';
  }
}
function show(text, busy) {
  mode = 'answer'; scroll = 0; waiting = !!busy;
  $('ansin').textContent = text;
  $('ansin').classList.toggle('dots', !!busy);
  render();
}
function ask(i) {
  last = i; show('Denke nach', true);
  clearTimeout(timer);
  timer = setTimeout(() => { if (waiting) show('Keine Antwort erhalten. Halten = nochmal.'); }, 30000);
  if (window.PluginMessageHandler) {
    PluginMessageHandler.postMessage(JSON.stringify({ message: PROMPTS[i][1] + SUFFIX, useLLM: true }));
  } else {
    setTimeout(() => onAnswer('(Desktop-Vorschau) Antwort auf: ' + PROMPTS[i][1]), 600);
  }
}
function onAnswer(text) {
  if (mode !== 'answer' || !waiting || !text) return;
  clearTimeout(timer); show(String(text).trim(), false);
}
window.onPluginMessage = function (d) {
  let t = null;
  try {
    const p = typeof d.data === 'string' ? JSON.parse(d.data) : d.data;
    if (p) t = typeof p === 'string' ? p : (p.message || p.answer || p.response || JSON.stringify(p));
  } catch (e) { if (typeof d.data === 'string') t = d.data; }
  onAnswer(t || d.message);
};

function move(dir) {
  if (mode === 'menu') { sel = (sel + dir + PROMPTS.length) % PROMPTS.length; render(); }
  else if (!waiting) {
    const max = Math.max(0, $('ansin').offsetHeight - $('ans').clientHeight);
    scroll = Math.max(0, Math.min(max, scroll + dir * 40)); render();
  }
}
function click() {
  if (mode === 'menu') ask(sel);
  else if (!waiting) { mode = 'menu'; sel = last; render(); }
}
let lastClick = 0;
window.addEventListener('scrollUp', () => move(-1));
window.addEventListener('scrollDown', () => move(1));
window.addEventListener('sideClick', () => { const n = Date.now(); if (n - lastClick > 120) click(); lastClick = n; });
window.addEventListener('longPressStart', () => { if (mode === 'answer' && !waiting) ask(last); });
document.body.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const y = e.touches[0].clientY;
  if (mode === 'menu') {
    const idx = Math.floor((y - 76) / 34), start = Math.max(0, Math.min(sel - 2, PROMPTS.length - 5));
    if (idx >= 0 && idx < 5 && start + idx < PROMPTS.length) { sel = start + idx; ask(sel); }
  } else move(y < 160 ? -1 : 1);
}, { passive: false });

if (!window.PluginMessageHandler) {
  window.addEventListener('keydown', (e) => {
    const m = { ArrowUp: 'scrollUp', ArrowDown: 'scrollDown', Enter: 'sideClick', ' ': 'longPressStart' };
    if (m[e.key]) window.dispatchEvent(new Event(m[e.key]));
  });
}
$('ver').textContent = 'v' + APP_VERSION;
render();
</script>
</body>
</html>
