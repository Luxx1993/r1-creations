<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Todoist</title>
<style>
:root {
  --safe: 0px;             /* set by fitScreen(): space for the R1 OS bar if it lies over the page */
  --h: 282px;              /* webview height, set by fitScreen() */
  --bg: #202020; --card: #282828; --card-sel: #2F2F2F; --nav: #242424;
  --text: #FCFCFC; --muted: #A8A8A8; --dim: #7A7A7A; --line: #3A3A3A;
  --red: #C24B4B; --red-ic: #D0544F; --red-lbl: #DC8478; --pill: #402424;
  --over: #DE8076; --today: #4FB062; --tom: #E8A33A; --later: #9A9A9A;
  --p1: #FF7066; --p2: #FF9A14; --p3: #5297FF; --p4: #8C8C8C;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 240px; height: var(--h); overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: Roboto, "Segoe UI", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
svg { display: block; }
#app { position: relative; width: 240px; height: var(--h); overflow: hidden; }

/* ---------- main screen ---------- */
#main { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: calc(var(--safe) + 2px); }
#hdr { flex: none; height: 30px; display: flex; align-items: center; padding: 0 4px 0 6px; gap: 2px; }
#back { width: 26px; height: 26px; display: none; align-items: center; justify-content: center; color: #E8E8E8; margin-left: -4px; }
#back.on { display: flex; }
#title { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#speak { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: #E8E8E8; }
#sync { height: 26px; min-width: 18px; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 0 3px; }
#sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); transition: background .2s; }
#sync.ok .dot { background: var(--today); }
#sync.busy .dot { background: var(--tom); animation: blink .9s ease-in-out infinite; }
#sync.wait .dot { background: var(--tom); }
#sync.off .dot { background: transparent; border: 1.5px solid var(--dim); }
#sync.bad .dot { background: var(--p1); }
#qcount { display: none; font-size: 9px; font-weight: 700; color: #1A1A1A; background: var(--tom); border-radius: 6px; padding: 0 4px; line-height: 12px; }
#qcount.on { display: block; }
#demo-tag { display: none; font-size: 8px; font-weight: 700; letter-spacing: .5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px; line-height: 11px; }
#demo-tag.on { display: block; }
@keyframes blink { 50% { opacity: .35; } }

#sbar { flex: none; display: none; padding: 0 6px 4px; }
#sbar.on { display: block; }
#q { width: 100%; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--card);
     color: var(--text); font: 12px Roboto, system-ui, sans-serif; padding: 0 8px; outline: none; }
#q::placeholder { color: var(--dim); }

#vp { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#list { position: absolute; left: 0; right: 0; top: 0; padding: 2px 6px 8px; will-change: transform; transition: transform .14s ease-out; }
#list.drag { transition: none; }
.empty { color: var(--dim); font-size: 12px; text-align: center; padding: 28px 12px 0; line-height: 1.5; }

.card { display: flex; align-items: flex-start; background: var(--card); border: 1px solid transparent; border-radius: 8px;
        padding: 6px 8px 6px 2px; margin-bottom: 3px; position: relative;
        transition: opacity .25s ease, transform .25s ease, border-color .12s; }
.card.sel { border-color: #6E6E6E; background: var(--card-sel); }
.card.sub { margin-left: 14px; }
.hit { flex: none; width: 26px; display: flex; justify-content: center; padding-top: 1px; }
.chk { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--pc, var(--p4)); background: var(--pf, transparent);
       display: flex; align-items: center; justify-content: center; transition: background .18s; }
.chk svg { width: 10px; height: 10px; opacity: 0; transform: scale(.4); transition: opacity .18s, transform .18s; color: #fff; }
.body { flex: 1; min-width: 0; }
.ttl { font-size: 12px; line-height: 15px; color: var(--text); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
       word-break: break-word; text-decoration: line-through; text-decoration-color: transparent; transition: color .25s, text-decoration-color .25s; }
.meta { display: flex; align-items: center; gap: 3px; margin-top: 2px; font-size: 10px; line-height: 12px; white-space: nowrap; }
.meta svg { width: 10px; height: 10px; flex: none; }
.meta .d { display: flex; align-items: center; gap: 3px; }
.meta .proj { margin-left: auto; color: var(--dim); overflow: hidden; text-overflow: ellipsis; min-width: 0; padding-left: 6px; }
.over { color: var(--over); } .today { color: var(--today); } .tom { color: var(--tom); } .later { color: var(--later); }
.pend { color: var(--dim); }
.card.done .chk { background: var(--pc, var(--p4)); }
.card.done .chk svg { opacity: 1; transform: scale(1); }
.card.done .ttl { color: var(--dim); text-decoration-color: var(--dim); }
.card.out { opacity: 0; transform: translateX(24px); }
/* project rows (Browsen) */
.prow { align-items: center; padding: 8px 10px 8px 8px; }
.prow .pdot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-right: 9px; }
.prow .ttl { -webkit-line-clamp: 1; font-size: 12px; }
.prow .cnt { margin-left: 8px; font-size: 10px; color: var(--dim); }
.prow.child { margin-left: 12px; }

/* bottom bar */
#nav { flex: none; height: 40px; background: var(--nav); display: flex; align-items: stretch; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #B0B0B0; }
.tab .ic { width: 34px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.tab .ic svg { width: 17px; height: 17px; }
.tab .lb { font-size: 8.5px; line-height: 10px; letter-spacing: .1px; }
.tab.on .ic { background: var(--pill); color: var(--red-ic); }
.tab.on .lb { color: var(--red-lbl); font-weight: 700; }
#plus { flex: 1; display: flex; align-items: center; justify-content: center; }
#plus .pb { width: 38px; height: 28px; border-radius: 10px; background: var(--red); display: flex; align-items: center; justify-content: center; color: #fff; transition: transform .1s; }
#plus.down .pb { transform: scale(.92); }
#plus .pb svg { width: 18px; height: 18px; }

/* undo bar + toast */
#undo { position: absolute; left: 8px; right: 8px; bottom: 46px; height: 30px; border-radius: 8px; background: #3A3A3A;
        display: flex; align-items: center; padding: 0 4px 0 10px; font-size: 11px; color: #EEE;
        opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; overflow: hidden; z-index: 20; }
#undo.on { opacity: 1; transform: none; pointer-events: auto; }
#undo .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#undo-btn { color: var(--red-lbl); font-weight: 700; font-size: 10.5px; letter-spacing: .3px; padding: 8px 6px; }
#undo .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--red-lbl); transform-origin: left; }
#toast { position: absolute; left: 8px; right: 8px; bottom: 46px; padding: 7px 8px; border-radius: 8px; background: #3A3A3A;
         color: #EEE; font-size: 11px; line-height: 14px; text-align: center; opacity: 0; transform: translateY(6px);
         transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
#toast.on { opacity: 1; transform: none; }

/* ---------- overlay screens ---------- */
.scr { position: absolute; inset: 0; background: var(--bg); padding: var(--safe) 10px 8px; display: none; flex-direction: column; z-index: 40; }
.scr.vis { display: flex; }
.scr h2 { margin: 2px 0 2px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.scr .sub { font-size: 10px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
textarea, .inp { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--text);
                 font: 13px/1.4 Roboto, system-ui, sans-serif; padding: 7px 8px; outline: none; -webkit-user-select: text; user-select: text; }
textarea { flex: 1; resize: none; min-height: 0; }
textarea:focus, .inp:focus { border-color: #6E6E6E; }
.row { display: flex; gap: 6px; margin-top: 7px; }
.btn { flex: 1; height: 30px; border-radius: 8px; background: #333; font-size: 11px; font-weight: 700; letter-spacing: .3px; color: #EEE; }
.btn.pri { background: var(--red); color: #fff; }
.btn.sm { height: 24px; font-size: 10px; font-weight: 600; background: #2C2C2C; color: var(--muted); }
.hint { font-size: 9px; color: var(--dim); text-align: center; margin-top: 5px; }

/* listening */
#s-listen { align-items: center; justify-content: center; text-align: center; }
.ring { width: 66px; height: 66px; border-radius: 50%; background: var(--red); position: relative; display: flex; align-items: center; justify-content: center; color: #fff; }
.ring::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--red); animation: pulse 1.2s ease-out infinite; }
.ring svg { width: 28px; height: 28px; }
@keyframes pulse { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
#ls-t { margin-top: 18px; font-size: 14px; font-weight: 700; }
#ls-s { margin-top: 4px; font-size: 10px; color: var(--muted); }

/* review */
#rv-text { flex: 1; font-size: 13px; }
.chips { display: flex; gap: 5px; margin-top: 7px; }
.chip { flex: 1; height: 30px; border-radius: 8px; background: #2C2C2C; border: 1.5px solid transparent; font-size: 9.5px; font-weight: 700; letter-spacing: .4px; color: var(--muted); }
.chip.sel { color: #fff; border-color: #8A8A8A; background: #3A3A3A; }
#ch-send.sel { background: var(--red); border-color: var(--red); }
#ch-discard.sel { background: #4A2626; border-color: #A04040; color: #FFB4AE; }

/* setup */
#s-setup label { font-size: 10px; color: var(--muted); margin: 4px 0 2px; display: block; }
#s-setup .inp { height: 28px; font-size: 11px; padding: 0 8px; }
#st-msg { font-size: 10.5px; line-height: 13px; min-height: 26px; margin-top: 5px; color: var(--muted); }
#st-msg.ok { color: var(--today); } #st-msg.bad { color: var(--p1); }
#st-close { margin-left: auto; width: 24px; height: 24px; display: none; align-items: center; justify-content: center; color: var(--muted); }
#st-close.on { display: flex; }
#st-ver { font-size: 8.5px; color: #555; margin-top: auto; text-align: right; }
</style>
</head>
<body>
<div id="app">

  <div id="main">
    <div id="hdr">
      <button id="back" aria-label="Zurück" data-ta="back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5.5 4.5 12l6.5 6.5"/></svg></button>
      <div id="title">Heute</div>
      <button id="speak" aria-label="Vorlesen" data-ta="speak"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg></button>
      <button id="sync" class="off" aria-label="Sync"><span id="demo-tag">DEMO</span><span class="dot"></span><span id="qcount"></span></button>
    </div>
    <div id="sbar"><input id="q" type="text" placeholder="Aufgaben suchen …" data-tp="search_ph" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <div id="vp"><div id="list"></div></div>
    <div id="nav">
      <button class="tab" data-view="inbox"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 13.5 6.5 5h11l3 8.5V19h-17z"/><path d="M3.5 13.5h5l1.5 2.5h4l1.5-2.5h5"/></svg></span><span class="lb" data-t="inbox">Eingang</span></button>
      <button class="tab" data-view="today"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17"/><text id="today-num" x="12" y="18.2" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none" font-family="Roboto, system-ui, sans-serif">7</text></svg></span><span class="lb" data-t="today">Heute</span></button>
      <button id="plus" aria-label="Neue Aufgabe" data-ta="new_task"><span class="pb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
      <button class="tab" data-view="search"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></span><span class="lb" data-t="search">Suchen</span></button>
      <button class="tab" data-view="browse"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 7h15M4.5 12h15M4.5 17h15"/></svg></span><span class="lb" data-t="browse">Browsen</span></button>
    </div>
    <div id="undo"><span class="msg" id="undo-msg">Erledigt</span><button id="undo-btn" data-t="undo">RÜCKGÄNGIG</button><span class="bar" id="undo-bar"></span></div>
    <div id="toast"></div>
  </div>

  <div class="scr" id="s-listen">
    <div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></div>
    <div id="ls-t" data-t="listening">Ich höre zu …</div>
    <div id="ls-s" data-t="release_stop">Loslassen zum Beenden</div>
  </div>

  <div class="scr" id="s-review">
    <h2 data-t="new_task">Neue Aufgabe</h2>
    <div class="sub" id="rv-target">→ Eingang</div>
    <textarea id="rv-text" readonly></textarea>
    <div class="chips">
      <button class="chip" id="ch-send" data-t="send">SENDEN</button>
      <button class="chip" id="ch-edit" data-t="edit">BEARBEITEN</button>
      <button class="chip" id="ch-discard" data-t="discard">VERWERFEN</button>
    </div>
    <div class="hint" id="rv-hint" data-t="hint_pick">Rad wählt · Taste bestätigt</div>
  </div>

  <div class="scr" id="s-edit">
    <h2 id="ed-title">Neue Aufgabe</h2>
    <div class="sub" id="ed-target">→ Eingang</div>
    <textarea id="ed-text" placeholder="z. B. Angebot prüfen morgen #Arbeit" data-tp="ed_ph"></textarea>
    <div class="row"><button class="btn" id="ed-cancel" data-t="cancel">Abbrechen</button><button class="btn pri" id="ed-save" data-t="save">Speichern</button></div>
  </div>

  <div class="scr" id="s-setup">
    <h2><span data-t="setup_title">Todoist verbinden</span><button id="st-close" aria-label="Schließen" data-ta="close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></h2>
    <label for="st-token" data-t="token_label">API-Token (Todoist → Einstellungen → Integrationen → Entwickler)</label>
    <input class="inp" id="st-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Token einfügen oder tippen" data-tp="token_ph">
    <label for="st-base" data-t="base_label">API-URL (bei CORS-Problemen Proxy-URL)</label>
    <input class="inp" id="st-base" type="url" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row"><button class="btn" id="st-test" data-t="test">Testen</button><button class="btn pri" id="st-save" data-t="save">Speichern</button></div>
    <div id="st-msg"></div>
    <div class="row" style="margin-top:2px"><button class="btn sm" id="st-demo">Demo ansehen</button><button class="btn sm" id="st-queue">Warteschlange leeren</button></div>
    <div id="st-ver"></div>
  </div>

</div>
<script>

const APP_VERSION = '0.1.2';

const $ = (id) => document.getElementById(id);

const MON = L.months;

  let cls, label = '';
  if (due.date < today) cls = 'over';
  else if (due.date === today) { cls = 'today'; label = tx('d_today'); }
  else if (due.date === dayOffset(1)) { cls = 'tom'; label = tx('d_tomorrow'); }
  else cls = 'later';
  if (due.date === dayOffset(-1)) label = tx('d_yesterday');
  if (!label) {
    const p = due.date.split('-').map(Number);
    label = p[2] + ' ' + MON[p[1] - 1] + (p[0] !== new Date().getFullYear() ? ' ' + p[0] : '');
  }

function TodoistProvider(cfg) {
  const base = (cfg.base || API_BASE).replace(/\/+$/, '');
  let inboxId = null;

  async function http(method, path, opts) {
    opts = opts || {};
    let url = base + '/' + path;
    if (opts.query) {
      const q = new URLSearchParams();
      Object.keys(opts.query).forEach((k) => { if (opts.query[k] != null) q.set(k, opts.query[k]); });
      const s = q.toString();
      if (s) url += '?' + s;
    }
    const headers = { Authorization: 'Bearer ' + cfg.token };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 15000);
    let res;
    try {
      res = await fetch(url, { method, headers, body: opts.body ? JSON.stringify(opts.body) : undefined, signal: ctl ? ctl.signal : undefined });
    } catch (e) {
      // CORS refusals and offline look identical from here: no response at all.
      throw new ApiError('network', 0, navigator.onLine === false ? 'offline' : 'Netz/CORS');
    } finally { clearTimeout(timer); }
    if (!res.ok) throw new ApiError('http', res.status, 'HTTP ' + res.status);
    const text = await res.text();
    if (!text) return null;
    try { return JSON.parse(text); } catch (e) { return text; }
  }

  async function paginate(path, query) {
    let out = [], cursor = null, pages = 0;
    do {
      const r = await http('GET', path, { query: Object.assign({ limit: 200 }, query, { cursor }) });
      const rows = Array.isArray(r) ? r : (r && r.results) || [];
      out = out.concat(rows);
      cursor = r && r.next_cursor;
    } while (cursor && ++pages < 15);
    return out;
  }

  function normDue(d) {
    if (!d) return null;
    const raw = d.datetime || d.date || '';
    let date = raw.slice(0, 10), time = null;
    if (raw.length > 10) {
      if (/Z$|[+-]\d\d:?\d\d$/.test(raw)) { const t = new Date(raw); date = ymd(t); time = pad(t.getHours()) + ':' + pad(t.getMinutes()); }
      else time = raw.slice(11, 16);
    }
    return { date, time, rec: !!d.is_recurring };
  }
  function norm(t) {
    return {
      id: String(t.id), content: t.content || '', p: 5 - (t.priority || 1), due: normDue(t.due),
      projectId: String(t.project_id || ''), parentId: t.parent_id ? String(t.parent_id) : null,
      order: t.child_order || 0, dayOrder: t.day_order == null ? 0 : t.day_order
    };
  }

  const api = {
    name: 'todoist',
    async listProjects() {
      const rows = await paginate('projects', {});
      const ps = rows.filter((p) => !p.is_archived && !p.is_deleted).map((p) => ({
        id: String(p.id), name: p.name || '', color: p.color || 'charcoal', inbox: !!(p.inbox_project || p.is_inbox_project),
        parentId: p.parent_id ? String(p.parent_id) : null, order: p.child_order || 0
      }));
      const inbox = ps.find((p) => p.inbox);
      if (inbox) inboxId = inbox.id;
      return ps;
    },
    async inboxId() { if (!inboxId) await api.listProjects(); return inboxId; },
    async listTasks(projectId) { return (await paginate('tasks', { project_id: projectId })).map(norm); },
    async listInbox() { const id = await api.inboxId(); return id ? api.listTasks(id) : []; },
    async listToday() { return (await paginate('tasks/filter', { query: 'today | overdue', lang: 'en' })).map(norm); },
    async listAll() { return (await paginate('tasks', {})).map(norm); },
    // Quick Add parses dates ("morgen"), #Projekt, p1 and @labels like the Todoist apps.
    // opts.createdId is set when a previous attempt already created the task but the move failed.
    async add(text, opts) {
      opts = opts || {};
      let task;
      if (opts.createdId) task = { id: opts.createdId, projectId: null, content: text };
      else {
        try { task = norm(await http('POST', 'tasks/quick', { body: { text } })); }
        catch (e) {
          if (!(e.kind === 'http' && (e.status === 404 || e.status === 405))) throw e;
          task = norm(await http('POST', 'tasks', { body: opts.projectId ? { content: text, project_id: opts.projectId } : { content: text } }));
        }
        if (opts.onCreated) await opts.onCreated(task.id);
      }
      const named = /(^|\s)#\S/.test(text);
      if (opts.projectId && !named && task.projectId !== opts.projectId) {
        await http('POST', 'tasks/' + task.id + '/move', { body: { project_id: opts.projectId } });
        task.projectId = opts.projectId;
      }
      return task;
    },
    async complete(id) { await http('POST', 'tasks/' + id + '/close'); },
    async reopen(id) { await http('POST', 'tasks/' + id + '/reopen'); },
    async update(id, text) { await http('POST', 'tasks/' + id, { body: { content: text } }); },
    async test() { const ps = await paginate('projects', {}); return ps.length; }
  };
  return api;
}

// ====================================================================
// Queue: every write is stored first, then sent. Network errors retry later,
// rejections (401/400/…) stay queued and show an error.
// ====================================================================
function enqueue(op) {
  op.id = op.id || uid(); op.ts = Date.now();
  S.queue.push(op);
  saveQueue();
  renderSync();
  setTimeout(flush, 0);
  return op;
}
const resolveId = (id) => S.idMap[id] || id;

async function runOp(op) {
  const P = S.provider;
  if (op.type === 'add') {
    const task = await P.add(op.text, {
      projectId: op.projectId, createdId: op.createdId,
      onCreated: async (id) => { op.createdId = id; await saveQueue(); }
    });
    S.idMap[op.tmpId] = task.id;
    if (S.selId === op.tmpId) S.selId = task.id;
    placeTask(task);
    return;
  }
  const id = resolveId(op.taskId);
  if (/^tmp_/.test(id)) throw new ApiError('orphan', 0, 'unbekannte Aufgabe');
  if (op.type === 'close') { await P.complete(id); S.hidden[id] = Date.now(); }
  else if (op.type === 'reopen') await P.reopen(id);
  else if (op.type === 'update') await P.update(id, op.text);
}

let flushing = null;
function flush() {
  if (flushing || !S.provider) return flushing || Promise.resolve();
  flushing = (async () => {
    let sent = 0;
    while (S.queue.length) {
      const op = S.queue[0];
      S.syncing++; renderSync();
      try {
        await runOp(op);
        S.queue.shift(); sent++;
        if (S.err && S.err.kind !== 'network') S.err = null;
        await saveQueue();
      } catch (e) {
        if (e.kind === 'orphan' || (e.kind === 'http' && e.status === 404 && op.type !== 'add')) {
          S.queue.shift(); await saveQueue(); continue;          // the task no longer exists
        }
        S.err = { kind: e.kind, status: e.status, op: op.type, at: Date.now() };
        break;
      } finally { S.syncing--; }
    }
    if (!S.queue.length && S.err && S.err.op) S.err = null;
    if (sent) { saveCacheSoon(); renderList(); }
    renderSync();
    return sent;
  })().finally(() => { flushing = null; });
  return flushing;
}

// Put a freshly created task into every cached list it belongs to.
function placeTask(task) {
  const L = S.cache.lists;
  const add = (key) => { if (L[key] && !L[key].some((t) => t.id === task.id)) L[key].push(task); };
  add('all');
  add('p:' + task.projectId);
  if (isInboxId(task.projectId)) add('inbox');
  if (task.due && task.due.date <= dayOffset(0)) add('today');
  saveCacheSoon();
}

// ====================================================================
// Sync (read)
// ====================================================================
async function refresh(key, quiet) {
  const P = S.provider; if (!P) return;
  key = key || curKey();
  S.syncing++; renderSync();
  try {
    const stale = Date.now() - (S.cache.at.projects || 0) > 5 * 60000;
    if (!S.cache.projects.length || stale || key === 'browse') {
      S.cache.projects = await P.listProjects(); S.cache.at.projects = Date.now();
    }
    let tasks;
    if (key === 'inbox') tasks = await P.listInbox();
    else if (key === 'today') tasks = await P.listToday();
    else if (key === 'all' || key === 'browse') tasks = await P.listAll();
    else if (key.slice(0, 2) === 'p:') tasks = await P.listTasks(key.slice(2));
    const listKey = key === 'browse' ? 'all' : key;
    if (tasks) { S.cache.lists[listKey] = tasks; S.cache.at[listKey] = Date.now(); }
    if (S.err && S.err.kind === 'network') S.err = null;
    if (S.err && !S.err.op) S.err = null;
    saveCacheSoon();
  } catch (e) {
    S.err = { kind: e.kind, status: e.status, at: Date.now() };
    if (!quiet) toast(errText(S.err));
  } finally {
    S.syncing--;
    renderSync();
    if (key === curKey() || (key === 'browse' && S.view === 'browse')) renderList();

function syncNow(quiet) {
  return flush().then(() => refresh(S.view === 'browse' ? 'browse' : curKey(), quiet));
}

function errText(err) {
  if (!err) return tx('synced');
  if (err.kind === 'network') return navigator.onLine === false ? tx('err_offline') : tx('err_net');
  if (err.status === 401 || err.status === 403) return tx('err_401', err.status);
  if (err.status === 400) return tx('err_400');
  if (err.status === 429) return tx('err_429');
  return tx('err_other', err.status || err.kind);
}

  let base = S.cache.lists[key];
  if (!base && key === 'all') {
    const seen = {}; base = [];
    Object.keys(S.cache.lists).forEach((lk) => S.cache.lists[lk].forEach((t) => { if (!seen[t.id]) { seen[t.id] = 1; base.push(t); } }));
  }
  base = base || [];
  const hide = {}, edit = {};
  Object.keys(S.hidden).forEach((id) => { hide[id] = 1; });
  S.queue.forEach((op) => {
    const id = op.taskId && resolveId(op.taskId);
    if (op.type === 'close') { hide[id] = 1; hide[op.taskId] = 1; }
    if (op.type === 'reopen') { delete hide[id]; delete hide[op.taskId]; }
    if (op.type === 'update') { edit[id] = op.text; edit[op.taskId] = op.text; }
  });
  // cards that are still animating out stay until the animation is done
  Object.keys(S.completing).forEach((id) => { delete hide[id]; });
  let out = base.filter((t) => !hide[t.id]).map((t) => (edit[t.id] != null ? Object.assign({}, t, { content: edit[t.id] }) : t));
  // pending adds show up immediately
  S.queue.forEach((op) => {
    if (op.type !== 'add' || hide[op.tmpId]) return;
    const pid = op.projectId;
    const fits = key === 'all' || (key === 'inbox' && !pid && !/(^|\s)#\S/.test(op.text)) || (pid && key === 'p:' + pid);
    if (fits) out.push({ id: op.tmpId, content: edit[op.tmpId] != null ? edit[op.tmpId] : op.text, p: 4, due: null, projectId: pid || '', parentId: null, order: 1e15 + op.ts, pending: true });
  });
  return sortTasks(out, key);
}

function sortTasks(list, key) {
  if (key === 'today') {
    const today = dayOffset(0);
    return list.slice().sort((a, b) => {
      const ao = a.due && a.due.date < today ? 0 : 1, bo = b.due && b.due.date < today ? 0 : 1;
      if (ao !== bo) return ao - bo;
      if (ao === 0 && a.due.date !== b.due.date) return a.due.date < b.due.date ? -1 : 1;
      return (a.p - b.p) || ((a.dayOrder || 0) - (b.dayOrder || 0)) || (a.order - b.order);
    });
  }
  if (key === 'all') {
    const q = S.search.trim().toLowerCase();
    const words = q ? q.split(/\s+/) : [];
    const hit = (t) => { const s = (t.content + ' ' + ((projectById(t.projectId) || {}).name || '')).toLowerCase(); return words.every((w) => s.indexOf(w) >= 0); };
    return list.filter(hit).sort((a, b) => {
      const ad = a.due ? a.due.date : '9999', bd = b.due ? b.due.date : '9999';
      return ad < bd ? -1 : ad > bd ? 1 : (a.p - b.p) || (a.order - b.order);
    });
  }
  // project/inbox: tree order, subtasks under their parent
  const byParent = {}, ids = {};
  list.forEach((t) => { ids[t.id] = 1; });
  list.forEach((t) => { const p = t.parentId && ids[t.parentId] ? t.parentId : ''; (byParent[p] = byParent[p] || []).push(t); });
  const out = [];
  (function walk(pid, depth) {
    (byParent[pid] || []).sort((a, b) => a.order - b.order).forEach((t) => { out.push(Object.assign({}, t, { depth })); if (depth < 3) walk(t.id, depth + 1); });
  })('', 0);
  return out;
}

function browseItems() {
  const all = S.cache.lists.all || [];
  const count = {};
  all.forEach((t) => { count[t.projectId] = (count[t.projectId] || 0) + 1; });
  const ps = S.cache.projects.filter((p) => !p.inbox);
  const byParent = {}, ids = {};
  ps.forEach((p) => { ids[p.id] = 1; });
  ps.forEach((p) => { const k2 = p.parentId && ids[p.parentId] ? p.parentId : ''; (byParent[k2] = byParent[k2] || []).push(p); });
  const out = [];
  (function walk(pid, depth) {
    (byParent[pid] || []).sort((a, b) => a.order - b.order).forEach((p) => { out.push({ id: 'proj:' + p.id, pid: p.id, name: p.name, color: p.color, depth, count: S.cache.lists.all ? (count[p.id] || 0) : null }); walk(p.id, depth + 1); });
  })('', 0);
  return out;
}

function applySelection() {

function switchView(view, projectId) {

  if (view === 'search' && S.view === 'project') S.prevView = 'project:' + S.projectId;
  S.view = view; S.projectId = view === 'project' ? projectId : null;
  S.selId = null; S.offset = 0;
  if (view !== 'search') $('q').blur();
  renderList();
  saveCacheSoon();
  refresh(view === 'browse' ? 'browse' : curKey(), true);
  if (view === 'search' && !S.cache.lists.all) refresh('all', true);
}
function goBack() {
  if (S.view === 'project') return switchView('browse');
  if (S.view === 'search') {
    const pv = S.prevView || 'today';
    return pv.indexOf('project:') === 0 ? switchView('project', pv.slice(8)) : switchView(pv);
  }
}

function completeTask(id) {
  const task = S.items.find((t) => t.id === id);
  if (!task || S.completing[id]) return;
  S.completing[id] = Date.now();
  // move the selection to the neighbour before the card disappears
  if (S.selId === id) {
    const i = S.items.indexOf(task);
    const next = S.items[i + 1] || S.items[i - 1];
    S.selId = next ? next.id : null;
  }
  const card = cardEl(id);
  if (card) {
    card.classList.add('done');
    setTimeout(() => card.classList.add('out'), 380);
  }
  enqueue({ type: 'close', taskId: id });
  showUndo(task);
  setTimeout(() => { delete S.completing[id]; renderList(); }, 650);
}

function undoComplete() {
  const task = S.undo; if (!task) return;
  hideUndo();
  const id = task.id;
  const idx = S.queue.findIndex((op, i) => op.type === 'close' && op.taskId === id && !(i === 0 && flushing));
  if (idx >= 0) { S.queue.splice(idx, 1); saveQueue(); }
  else enqueue({ type: 'reopen', taskId: id });
  delete S.hidden[resolveId(id)]; delete S.hidden[id]; delete S.completing[id];
  // put it back where it was if a refresh dropped it meanwhile
  const clean = Object.assign({}, task); delete clean.depth;
  if (!clean.pending) placeTask(clean);
  S.selId = id;
  renderList(); renderSync();
}

function addTask(text) {

  if (!text) return;
  const projectId = S.view === 'project' ? S.projectId : null;
  const tmpId = 'tmp_' + uid();
  enqueue({ type: 'add', text, projectId, tmpId });
  S.selId = tmpId;
  renderList();
  toast(tx('saved_to', targetName()));
}
function targetName() {

  return tx('inbox');
}

function speakList() {
  const items = S.items.slice(0, 8);

  let text;
  if (!items.length) text = tx('no_tasks', titleFor());
  else {
    const total = S.items.length;
    const noun = S.view === 'browse' ? tx(total === 1 ? 'project1' : 'projectN') : tx(total === 1 ? 'task1' : 'taskN');
    text = titleFor() + ', ' + total + ' ' + noun + '. ' + items.map((t, i) => words[i] + ': ' + String(t.content || t.name).replace(/["„“]/g, '').replace(/[.!?]+$/, '') + '.').join(' ');

        message: tx('speak_prompt', text),

function setupMsg(text, cls) { const el = $('st-msg'); el.textContent = text; el.className = cls || ''; }

  const loop = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/i.test(base);
  if (!/^https:\/\/[^/]+/i.test(base) && !loop) return { err: tx('err_https') };

async function useMode(mode, wipe) {

  S.cache = { projects: (cache && cache.projects) || [], lists: (cache && cache.lists) || {}, at: (cache && cache.at) || {} };
  if (cache && cache.view) { S.view = cache.view; S.projectId = cache.projectId || null; }
  if (S.view === 'project' && !S.projectId) S.view = 'today';
  const q = await store.get('plain', k('queue'));
  S.queue = (q && q.ops) || []; S.idMap = (q && q.idMap) || {};
  S.err = null; S.hidden = {}; S.completing = {}; S.selId = null; S.offset = 0;
  renderList(); renderSync();
}

// ====================================================================
// Input: touch
// ====================================================================
// Pointer events only and no preventDefault anywhere: touchstart+preventDefault
// is known to crash the R1 keyboard.
let holdTimer = null, holdFired = false, holdX = 0, holdY = 0;
function armHold(e) {
  holdFired = false; holdX = e.clientX; holdY = e.clientY;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { if (S.screen === 'main') { holdFired = true; openSetup(false); } }, 1000);
}
function cancelHold() { clearTimeout(holdTimer); holdTimer = null; }
$('main').addEventListener('pointerdown', (e) => {
  if (e.target.closest('#plus') || e.target.closest('#q')) return;
  armHold(e);
});
document.addEventListener('pointermove', (e) => { if (holdTimer && Math.abs(e.clientX - holdX) + Math.abs(e.clientY - holdY) > 8) cancelHold(); });
document.addEventListener('pointerup', cancelHold);
document.addEventListener('pointercancel', cancelHold);

// list: drag to scroll, tap to select / open / complete
const vp = $('vp');
let drag = null;
vp.addEventListener('pointerdown', (e) => {
  drag = { y: e.clientY, off: S.offset, moved: false, target: e.target };
  try { vp.setPointerCapture(e.pointerId); } catch (err) {}
});
vp.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dy) > 6) { drag.moved = true; $('list').classList.add('drag'); }
  if (drag.moved) setOffset(drag.off - dy);
});
function endDrag(e, cancelled) {
  if (!drag) return;
  const d = drag; drag = null;
  $('list').classList.remove('drag');
  if (cancelled || d.moved || holdFired || S.screen !== 'main') return;
  const card = d.target.closest && d.target.closest('.card');
  if (!card) return;
  const id = card.dataset.id;
  if (S.view === 'browse') { switchView('project', id.slice(5)); return; }
  if (d.target.closest('.hit')) { completeTask(id); return; }
  if (S.selId === id) { const t = S.items.find((x) => x.id === id); if (t) openEditor('edit', t); }
  else { S.selId = id; applySelection(); }
}
vp.addEventListener('pointerup', (e) => endDrag(e, false));
vp.addEventListener('pointercancel', (e) => endDrag(e, true));

document.querySelectorAll('.tab').forEach((t) => t.addEventListener('pointerup', () => {
  if (holdFired) return;
  const v = t.dataset.view;
  if (v === S.view) { syncNow(true); return; }
  switchView(v);
  if (v === 'search') setTimeout(() => $('q').focus(), 30);
}));
$('back').addEventListener('pointerup', () => { if (!holdFired) goBack(); });
$('speak').addEventListener('pointerup', () => { if (!holdFired) speakList(); });
$('sync').addEventListener('pointerup', () => {
  if (holdFired) return;
  toast(S.mode === 'demo' ? tx('demo_toast') : (S.queue.length ? tx('waiting_n', S.queue.length) : '') + errText(S.err));
  syncNow(true);
});
$('q').addEventListener('input', () => { S.search = $('q').value; S.selId = null; S.offset = 0; renderList(); });
$('q').addEventListener('pointerup', () => $('q').focus());

// plus: tap = type, hold = speak
let plusTimer = null, plusVoice = false;
const plus = $('plus');
plus.addEventListener('pointerdown', (e) => {
  plusVoice = false; plus.classList.add('down');
  try { plus.setPointerCapture(e.pointerId); } catch (err) {}
  clearTimeout(plusTimer);
  plusTimer = setTimeout(() => { plusVoice = true; startListening('add'); }, 550);
});
function plusEnd(cancel) {
  plus.classList.remove('down'); clearTimeout(plusTimer);
  if (plusVoice) { plusVoice = false; stopListening(); return; }
  if (!cancel && S.screen === 'main') openEditor('add');
}
plus.addEventListener('pointerup', () => plusEnd(false));
plus.addEventListener('pointercancel', () => plusEnd(true));

$('undo-btn').addEventListener('pointerup', undoComplete);

ACTIONS.forEach((a, i) => $('ch-' + a).addEventListener('pointerup', () => { S.reviewIdx = i; renderReview(); reviewAction(a); }));
$('rv-text').addEventListener('pointerup', () => { if (!S.reviewEditing) beginReviewEdit(); });
$('ed-save').addEventListener('pointerup', () => closeEditor(true));
$('ed-cancel').addEventListener('pointerup', () => closeEditor(false));
$('ed-text').addEventListener('pointerup', () => $('ed-text').focus());
['st-token', 'st-base'].forEach((id) => $(id).addEventListener('pointerup', () => $(id).focus()));
$('st-test').addEventListener('pointerup', testSetup);
$('st-save').addEventListener('pointerup', saveSetup);
$('st-demo').addEventListener('pointerup', async () => {
  if (S.cfg && S.cfg.token && !confirmTwice()) return;
  startDemo();
});
let confirmAt = 0;
function confirmTwice() {
  if (Date.now() - confirmAt < 3000) return true;
  confirmAt = Date.now(); setupMsg(tx('confirm_logout'), 'bad'); return false;
}
$('st-queue').addEventListener('pointerup', async () => {
  S.queue = []; S.idMap = {}; S.err = null; await saveQueue();
  $('st-queue').style.visibility = 'hidden'; setupMsg(tx('queue_cleared'), ''); renderSync();
});
$('st-close').addEventListener('pointerup', () => { $('st-token').blur(); $('st-base').blur(); show('main'); });

// ====================================================================
// Input: R1 hardware
// ====================================================================
let lastSide = 0, suppressRelease = false;
window.addEventListener('sideClick', () => {
  // a PTT double click arrives as two sideClicks ~50 ms apart: never complete two tasks
  const now = Date.now(); if (now - lastSide < 400) return; lastSide = now;
  if (S.screen === 'setup') return saveSetup();
  if (S.screen === 'edit') return closeEditor(true);
  if (S.screen === 'review') return reviewAction(S.reviewEditing ? 'send' : ACTIONS[S.reviewIdx]);
  if (S.screen !== 'main') return;
  if (!S.items.length) return;
  if (!S.selId) { S.selId = S.items[0].id; applySelection(); return; }
  if (S.view === 'browse') { const p = S.items.find((x) => x.id === S.selId); if (p) switchView('project', p.pid); return; }
  completeTask(S.selId);
});
window.addEventListener('longPressStart', () => {
  if (S.screen === 'setup' || S.screen === 'edit') { suppressRelease = true; return; }
  if (S.screen === 'review') { $('rv-text').blur(); }       // hold again = record again
  startListening(S.view === 'search' && S.screen === 'main' ? 'search' : 'add');
});
window.addEventListener('longPressEnd', () => {
  if (suppressRelease) { suppressRelease = false; return; }
  stopListening();
});
function wheel(dir) {
  if (S.screen === 'review') {
    if (S.reviewEditing) { $('rv-text').scrollTop += dir * 24; return; }
    S.reviewIdx = Math.max(0, Math.min(ACTIONS.length - 1, S.reviewIdx + dir)); renderReview(); return;
  }
  if (S.screen === 'edit') { $('ed-text').scrollTop += dir * 24; return; }
  if (S.screen !== 'main' || !S.items.length) return;
  let i = S.items.findIndex((x) => x.id === S.selId);
  i = i < 0 ? (dir > 0 ? 0 : S.items.length - 1) : Math.max(0, Math.min(S.items.length - 1, i + dir));
  S.selId = S.items[i].id;
  applySelection();
}
window.addEventListener('scrollUp', () => wheel(-1));
window.addEventListener('scrollDown', () => wheel(1));

window.onPluginMessage = function (data) {
  if (!data) return;
  if (data.type === 'sttEnded') { onTranscript(data.transcript || ''); return; }
  // LLM echoes from "Vorlesen" are ignored: the screen stays the primary output.
};

// desktop fallbacks: Space hold = PTT, Esc = side button, arrows = wheel
document.addEventListener('keydown', (e) => {
  const ae = document.activeElement;
  const typing = ae && /INPUT|TEXTAREA/.test(ae.tagName) && !ae.readOnly;
  if (e.key === 'Escape') { window.dispatchEvent(new Event('sideClick')); return; }
  if (typing) return;
  if (e.key === 'ArrowUp') window.dispatchEvent(new Event('scrollUp'));
  if (e.key === 'ArrowDown') window.dispatchEvent(new Event('scrollDown'));
  if (e.key === ' ' && !e.repeat) { window.dispatchEvent(new Event('longPressStart')); }
});
document.addEventListener('keyup', (e) => {
  if (e.key === ' ' && S.listening) window.dispatchEvent(new Event('longPressEnd'));
});

// ====================================================================
// Boot
// ====================================================================
(async function boot() {
  renderChrome();
  SDK = await waitForSdk(IS_R1 ? 3000 : 300);
  S.cfg = await store.get('secure', 'cfg');
  const live = !!(S.cfg && S.cfg.token);
  await useMode(live ? 'live' : 'demo');
  if (!S.cfg) openSetup(true);
  syncNow(true);
  setInterval(() => { if (S.screen === 'main' || S.screen === 'setup') syncNow(true); }, SYNC_MS);
  window.addEventListener('online', () => syncNow(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') syncNow(true); else { saveCacheNow(); saveQueue(); }
  });
  window.addEventListener('pagehide', () => { saveCacheNow(); saveQueue(); });
})();
</script>
</body>
</html>
