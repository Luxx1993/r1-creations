<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Sprachtest</title>
<style>
  :root { --bg:#15171c; --fg:#f1efe9; --muted:#8b909c; --ok:#7fb7a4; --bad:#e08a7a; --card:#232730; --focus:#2f3542; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:240px; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:14px; line-height:1.35; }
  body { height:282px; overflow-y:auto; padding:8px 10px 30px; }
  h1 { margin:0 0 6px; font-size:15px; color:var(--muted); font-weight:600; }
  .box { background:var(--card); border-radius:6px; padding:8px 10px; margin-bottom:8px; word-break:break-word; }
  .label { color:var(--muted); font-size:12px; margin-bottom:2px; }
  .text { font-size:17px; min-height:24px; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:1px 0; font-size:13px; }
  .ok { color:var(--ok); font-weight:600; }
  .bad { color:var(--bad); font-weight:600; }
  button { width:100%; margin-bottom:8px; padding:12px 10px; font:inherit; font-size:16px; font-weight:600;
    color:var(--fg); background:var(--focus); border:0; border-left:5px solid var(--ok); border-radius:6px; text-align:left; }
  button.rec { border-left-color:var(--bad); background:#3a2a2a; }
  button small { display:block; font-size:12px; font-weight:400; color:var(--muted); }
  #raw { font-size:11px; color:var(--muted); white-space:pre-wrap; max-height:90px; overflow:hidden; }
  #ver { color:var(--muted); font-size:10px; text-align:right; }
</style>
</head>
<body>
<h1>Sprachtest</h1>

<div class="box">
  <div class="row"><span>Spracherkennung</span><span id="s1"></span></div>
  <div class="row"><span>R1-Nachrichten</span><span id="s2"></span></div>
</div>

<button id="hold">1. Halten und sprechen<small>oder Seitentaste halten</small></button>
<div class="box">
  <div class="label">Erkannter Text</div>
  <div class="text" id="transcript">noch nichts</div>
</div>

<button id="speak">2. Vom R1 vorlesen lassen<small>spricht den erkannten Text</small></button>
<button id="beep">3. Testton abspielen<small>prüft den Lautsprecher</small></button>

<div class="box">
  <div class="label">Status</div>
  <div id="status">bereit</div>
</div>

<div class="box">
  <div class="label">Rohdaten der letzten Nachricht</div>
  <div id="raw">-</div>
</div>

<div id="ver">v1.2.0</div>

<script>
  const $ = (id) => document.getElementById(id);
  const hasVoice = typeof CreationVoiceHandler !== "undefined";
  const hasMsg = typeof PluginMessageHandler !== "undefined";

  function badge(el, ok) { el.textContent = ok ? "ja" : "fehlt"; el.className = ok ? "ok" : "bad"; }
  badge($("s1"), hasVoice);
  badge($("s2"), hasMsg);

  function setStatus(t) { $("status").textContent = t; }

  // Rohdaten anzeigen, damit wir sehen, was der R1 wirklich sendet
  function showRaw(data) {
    let s;
    try { s = JSON.stringify(data); } catch (e) { s = String(data); }
    $("raw").textContent = s.length > 300 ? s.slice(0, 300) + " ..." : s;
  }

  let listening = false;
  let lastText = "";

  function startListening() {
    if (listening) return;
    if (!hasVoice) { setStatus("Keine Spracherkennung. Nur am R1 möglich."); return; }
    listening = true;
    $("hold").classList.add("rec");
    setStatus("Ich höre zu ...");
    CreationVoiceHandler.postMessage("start");
  }

  function stopListening() {
    if (!listening) return;
    $("hold").classList.remove("rec");
    setStatus("Verarbeite ...");
    if (hasVoice) CreationVoiceHandler.postMessage("stop");
  }

  // Ergebnisse vom R1 (Spracherkennung und KI-Antworten)
  window.onPluginMessage = function (data) {
    showRaw(data);
    if (data && data.type === "sttEnded") {
      listening = false;
      $("hold").classList.remove("rec");
      lastText = (data.transcript || "").trim();
      $("transcript").textContent = lastText || "(leer)";
      setStatus(lastText ? "Text erkannt." : "Nichts erkannt. Nochmal versuchen.");
      return;
    }
    if (data && (data.data || data.message)) {
      setStatus("Antwort vom R1 erhalten.");
    }
  };

  // Seitentaste halten = sprechen
  window.addEventListener("longPressStart", startListening);
  window.addEventListener("longPressEnd", stopListening);

  // Bildschirmtaste halten = sprechen (ohne preventDefault, sonst stürzt die Tastatur ab)
  const hold = $("hold");
  hold.addEventListener("pointerdown", startListening);
  hold.addEventListener("pointerup", stopListening);
  hold.addEventListener("pointerleave", () => { if (listening) stopListening(); });
  hold.addEventListener("pointercancel", () => { if (listening) stopListening(); });

  // Test 2: Der R1 liest einen Satz über sein eigenes Modell vor
  $("speak").addEventListener("click", () => {
    if (!hasMsg) { setStatus("Keine R1-Nachrichten. Nur am R1 möglich."); return; }
    const text = lastText || "Hallo Lukas, das ist ein Test.";
    setStatus("Bitte den R1 um Vorlesen ...");
    PluginMessageHandler.postMessage(JSON.stringify({
      message: "Sprich genau diesen Satz laut aus und sonst nichts: " + text,
      useLLM: true,
      wantsR1Response: true
    }));
  });

  // Test 3: Eigenen Ton erzeugen und über das Audio-Element abspielen
  function makeBeepUrl() {
    const rate = 22050, secs = 0.6, n = Math.floor(rate * secs);
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const env = Math.min(1, i / 800, (n - i) / 800);
      v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 523 * i / rate) * 0.4 * env * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  $("beep").addEventListener("click", async () => {
    try {
      const a = new Audio(makeBeepUrl());
      a.volume = 1;
      await a.play();
      setStatus("Ton wird abgespielt. Hörst du ihn?");
    } catch (e) {
      setStatus("Wiedergabe fehlgeschlagen: " + (e && e.name ? e.name : "Fehler"));
    }
  });

  // Drehregler scrollt die Seite
  window.addEventListener("scrollUp", () => window.scrollBy(0, -60));
  window.addEventListener("scrollDown", () => window.scrollBy(0, 60));

  // Vorschau am Computer: Leertaste halten, Pfeiltasten scrollen
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") scrollBy(0, -60);
    if (e.key === "ArrowDown") scrollBy(0, 60);
    if (e.key === " " && !e.repeat) startListening();
  });
  window.addEventListener("keyup", (e) => { if (e.key === " ") stopListening(); });
</script>
</body>
</html>
