name: Deploy Pages

on:
  push:
    branches: [main, "creation/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

jobs:
  # The github-pages environment only lets main deploy. A push to a creation
  # branch therefore just starts this workflow again on main, which rebuilds the
  # whole site (hub page plus every creation/* branch) and deploys it.
  trigger:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the site from main
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch creation branches
        run: git fetch origin '+refs/heads/creation/*:refs/remotes/origin/creation/*'
      - name: Build site
        run: python3 tools/build_site.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
