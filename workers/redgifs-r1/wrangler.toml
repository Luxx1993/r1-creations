name = "r1-rg"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false
keep_vars = true                 # keep variables set in the dashboard across deploys

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true          # every request passes the access-key check in the worker
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Hub that the home relay (relay/) connects to; SQLite-backed Durable Objects work on the free plan.
[[durable_objects.bindings]]
name = "RELAY_HUB"
class_name = "RelayHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayHub"]

[observability]
enabled = false                  # no request logs

# Optional, recommended: global token cache (otherwise each worker isolate keeps its own token).
#   npx wrangler kv namespace create TOKEN_KV   -> paste the id below and uncomment
# [[kv_namespaces]]
# binding = "TOKEN_KV"
# id = "<id>"

# Secrets (never commit them):  ACCESS_KEY, and RELAY_SECRET to enable the home relay
