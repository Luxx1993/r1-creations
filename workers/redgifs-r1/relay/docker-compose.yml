# RG Clips relay for a NAS: one self-contained file, nothing else to upload, no ports to open.
# The container connects OUT to your Cloudflare worker and fetches RedGifs lists with your home IP.
# UGREEN (UGOS Pro): Docker -> Project -> Create, paste this file, fill in the two values below.
# Other NAS / CLI: save as docker-compose.yml in an empty folder, then `docker compose up -d`.
services:
  relay:
    image: node:22-alpine
    environment:
      WORKER_URL: "https://r1-rg.HIER-EINTRAGEN.workers.dev"   # your worker address
      RELAY_SECRET: "HIER-EINTRAGEN"     # 32 letters/digits, same value as secret RELAY_SECRET in the worker
      # relay.mjs from this repo, pinned to a commit and checked against its SHA-256
      RELAY_SRC: https://raw.githubusercontent.com/Luxx1993/r1-creations/8f82f2733c8852bf5fb74fda93fc6dd0bfc10d43/workers/redgifs-r1/relay/relay.mjs
      RELAY_SHA256: 1eed8ee632237ce35175f9d461c10c63dca2e44814ae4d085fb24242fb0749e2
    entrypoint: ["/bin/sh", "-c", "wget -qO /tmp/relay.mjs \"$$RELAY_SRC\" && echo \"$$RELAY_SHA256  /tmp/relay.mjs\" | sha256sum -c - && exec node /tmp/relay.mjs"]
    restart: unless-stopped
