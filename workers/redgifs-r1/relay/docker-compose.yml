# RG Clips relay for a NAS: relay (Node) + Tailscale Funnel for a fixed public HTTPS address.
# Fill in .env (see .env.example), then: docker compose up -d
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: r1-relay                   # becomes https://r1-relay.<your-tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true                # no /dev/net/tun or extra privileges needed
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    restart: unless-stopped

  relay:
    image: node:22-alpine
    network_mode: service:tailscale      # Tailscale forwards to 127.0.0.1:8080 in this shared network
    depends_on: [tailscale]
    environment:
      - RELAY_SECRET=${RELAY_SECRET}
      - PORT=8080
    volumes:
      - ./relay.mjs:/app/relay.mjs:ro
    command: ["node", "/app/relay.mjs"]
    restart: unless-stopped
