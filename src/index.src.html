<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Clawd</title>
<style>
  /*@FONT@*/
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { position: relative; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: transform .2s ease-out;
           width: 240px; height: 282px; display: block; touch-action: none;
           -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<canvas id="c" width="240" height="282"></canvas>
<script>
// Clawd, a pet diorama. Scenery, styles and Clawd's animations come from the
// Claude Fables plugin (baked to images by src/r1assets.ts).
const APP_VERSION = '0.12.3';
const KEY = 'clawd:state';          // namespaced: all creations share one origin
const MANI = /*@MANI@*/null;
const LOOKS = /*@LOOKS@*/null;
// the canvas is 240x282 upright and 282x240 when the device is held sideways (see layout()); the OS bar always stays on the
// device's top edge, so it eats 40 px of whichever canvas edge that is (INL/INR/INB, or TOP when upright)
let W = 240, H = 282, TOP = 40, INL = 0, INR = 0, INB = 0;
const MENU_H = 36;
let MENU_Y = 246;                   // the menu strip over the bottom of the scenery
const BGS = MANI.bgscale;           // scenery image px per stage unit, shown 1:1
const BGW = MANI.sw * BGS, BGH = MANI.h * BGS;   // 800 x 320: a long strip Clawd walks along
const BG_YOFF = 55;                 // crop the sky so the floor line sits near y 205
let BGF, WORLD, ITEM_W, PH, PY;   // set by layout(): the cropped scenery fills the height exactly, WORLD is the width of one picture (the world repeats forever)
const K = 0.95 * 1.1;               // Clawd sheet px -> logical px
const CELLW = MANI.cw * MANI.scale, CELLH = MANI.ch * MANI.scale;
const SCENES = ['forest', 'space', 'city', 'desert', 'volcano', 'lab', 'night'];
const SCENE_DE = { forest: 'Wald', space: 'Weltraum', city: 'Stadt', desert: 'Wüste', volcano: 'Vulkan', lab: 'Labor', night: 'Dorf' };
const LOOK_DE = { pixel: 'Pixel Art', original: 'Original', cave: 'Höhle', blueprint: 'Blaupause', mosaic: 'Mosaik', aero: 'Frutiger Aero', engraving: 'Kupferstich', tapestry: 'Wandteppich', golden: 'Golden Age', ukiyoe: 'Ukiyo-e', kamon: 'Kamon' };
const HATS = ['Nichts', 'Partyhut', 'Zylinder', 'Krone', 'Mütze', 'Propeller'];
const FACES = ['Nichts', 'Brille', 'Sonnenbrille', 'Schnurrbart'];
const BODIES = ['Nichts', 'Schleife', 'Schal'];

const cv = document.getElementById('c');
const DPR = Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1)));
const ctx = cv.getContext('2d');

const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- rotation (as in Tally): the WebView stays portrait, so the canvas is turned when the device is held sideways ----------
const ORIENT_DIR = 1;      // set to -1 if the content turns the wrong way on the device
let rot = 0, acc = 0, refAng = null, pending = null, pendingSince = 0;
function layout() {
  const sideways = rot === 90 || rot === 270;
  W = sideways ? 282 : 240; H = sideways ? 240 : 282;
  INL = rot === 90 ? 40 : 0; INR = rot === 270 ? 40 : 0; INB = rot === 180 ? 40 : 0; TOP = rot === 0 ? 40 : 0;
  MENU_Y = H - INB - MENU_H;
  BGF = H / (BGH - BG_YOFF); WORLD = BGW * BGF;
  ITEM_W = (W - INL - INR) / 5;
  PH = MENU_H; PY = MENU_Y;                           // the Welt / Items picker takes the menu's place and size
  cv.width = W * DPR; cv.height = H * DPR;           // resizing resets the context
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cv.style.transform = 'translate(-50%, -50%) rotate(' + acc + 'deg)';
}
function setRot(deg) {
  const next = ((deg % 360) + 360) % 360, oldWorld = WORLD;
  acc += ((next - rot + 540) % 360) - 180;           // shortest signed step, so the turn never goes the long way round
  rot = next; layout();
  const f = WORLD / oldWorld;
  R.x *= f; R.cam *= f; R.target *= f;
  if (R.ambScene) makeAmbient();
}
function orient(d) {
  const x = d.tiltX ?? d.x ?? d.rawX ?? 0, y = d.tiltY ?? d.y ?? d.rawY ?? 0;
  if (Math.hypot(x, y) < 0.5) return;                // lying flat: keep the current rotation
  const ang = Math.atan2(x, y) * 180 / Math.PI;      // direction of gravity in the screen plane
  if (refAng === null) refAng = ang;                 // the first reading is how the card was opened: upright
  const want = -ORIENT_DIR * (ang - refAng);
  const target = ((Math.round(want / 90) * 90) % 360 + 360) % 360;
  const off = Math.abs(((want - rot) % 360 + 540) % 360 - 180);
  if (target === rot || off < 60) { pending = null; return; }   // hysteresis
  const now = Date.now();
  if (pending !== target) { pending = target; pendingSince = now; return; }
  if (now - pendingSince > 400) { setRot(target); pending = null; }
}

// ---------- state ----------
const S = { scene: 'forest', look: 'original', hat: 0, face: 0, body: 0, vol: 3, pack: 0, quiet: 0, calm: 0, tod: 1, born: Date.now() };
let ready = false;
const R = {
  x: 240, cam: 0, ox: 0, look: 1, mode: 'idle', t: 0, wait: 1.5, target: 240, time: 0, greet: 3,
  hold: false, touchPet: false, touchT: 0, sleeping: false, sel: 0, lastClick: 0, lastTouch: 0, taps: [],
  P: [], say: null, dim: 0, petHeart: 0, jerk: 0, prev: null, shakeCool: 0, storageTag: '?',
  bg: null, sheet: null, bgKey: '', sheetKey: '', anim: '', animT0: 0, act: null,
  tod: 'day', todT: 0, panel: null, prow: 0, gameSel: 0, lastSnore: -9, pk: [], lift: 0, drag: null, brk: { l: 0, r: 0, y: 0 }, brkT: null, brkKey: '', menuOn: false, menuT: 0, fast: false, amb: [], ambScene: '',
};
layout();
const floorY = () => (MANI.floors[S.scene] * BGS - BG_YOFF) * BGF;
const feetY = () => Math.min(floorY() + 14, MENU_Y - 10);
const petting = () => (R.hold || (R.touchPet && R.time - R.touchT > .25)) && !R.sleeping && (R.mode === 'idle' || R.mode === 'walk') && !R.panel;
const busyNow = () => !(R.mode === 'idle' || R.mode === 'walk');
// ---------- the styles: icons, frames and type follow the scenery's art style ----------
const MONO = 'Monocraft, ui-monospace, monospace';
const SERIF = "Georgia, 'Times New Roman', serif";
const SANS = "'Segoe UI', 'Helvetica Neue', Arial, sans-serif";
const COMIC = "'Comic Sans MS', 'Comic Neue', cursive, sans-serif";
const one = c => ({ feed: [c, c], play: [c, c, c], sleep: [c], clean: [c, c], heart: [c], bug: [c, c] });
const NAT = { feed: ['#E8B64C', '#8a5a1e'], play: ['#33b5b0', '#d9fffb', '#1b7471'], sleep: ['#cfd8ff'], clean: ['#a8743c', '#e8d27a'], heart: ['#ff5c7a'], bug: ['#5fbf5f', '#2f7f3f'] };
// font, size factor, outline (ink, width in 16-unit icon space), px = low-res grid the icons are drawn on (tile = as tesserae/weave),

const STY = {
  original:  { font: MONO, fs: 1, ink: 'rgba(30,20,15,.28)', lw: .6, frame: 'round', r: 4, bw: 2, tones: NAT, dark: '#2b2420' },
  pixel:     { font: MONO, fs: 1, ink: '#3a1e14', lw: .9, px: 16, frame: 'pixel', tones: NAT },
  cave:      { font: COMIC, fs: 1.1, italic: true, ink: '#1b130f', lw: 1.3, frame: 'round', r: 7, bw: 2.5,
               tones: { feed: ['#cf8a2e', '#a4452a'], play: ['#a4452a', '#e6d6b2', '#1b130f'], sleep: ['#e6d6b2'], clean: ['#1b130f', '#cf8a2e'], heart: ['#a4452a'], bug: ['#1b130f', '#a4452a'] } },
  blueprint: { font: SANS, fs: 1.1, upper: true, ink: '#e8f0ff', lw: .8, line: true, frame: 'double', tones: one('#e8f0ff') },
  mosaic:    { font: SERIF, fs: 1.1, ink: '#2c2723', lw: 0, px: 12, tile: true, frame: 'tile', alt: '#c49a58',
               tones: { feed: ['#c49a58', '#2c2723'], play: ['#3b76a6', '#dbe7ea', '#2c2723'], sleep: ['#e8dec6'], clean: ['#2c2723', '#c49a58'], heart: ['#a5452f'], bug: ['#4b5560', '#a5452f'] } },
  aero:      { font: SANS, fs: 1.1, ink: '#ffffff', lw: 0, jelly: true, frame: 'gloss', r: 9, stroke: '#2a8ad8', dark: '#10407a',
               tones: { feed: ['#ffcf3f', '#b8620a'], play: ['#38c4e8', '#ffffff', '#0d78dc'], sleep: ['#dff3ff'], clean: ['#0d78dc', '#ffbd5c'], heart: ['#ff5c8a'], bug: ['#6fd13f', '#2a6a10'] } },
  engraving: { font: SERIF, fs: 1.1, ink: '#1c1611', lw: .9, hatch: true, frame: 'double',
               tones: { feed: ['#d9c9a4', '#1c1611'], play: ['#d9c9a4', '#f6f0e2', '#1c1611'], sleep: ['#e8dcc0'], clean: ['#1c1611', '#d9c9a4'], heart: ['#cdb98f'], bug: ['#1c1611', '#cdb98f'] } },
  tapestry:  { font: SERIF, fs: 1.1, ink: '#1a0b08', lw: 0, px: 10, tile: true, frame: 'weave', alts: ['#93321f', '#e2b437', '#2f4a6a'],
               tones: { feed: ['#e2b437', '#6a3f20'], play: ['#2f4a6a', '#efb39a', '#141e38'], sleep: ['#e8dab4'], clean: ['#6a3f20', '#e2b437'], heart: ['#b64a2d'], bug: ['#2f5236', '#93321f'] } },
  golden:    { font: COMIC, fs: 1.1, upper: true, ink: '#16120f', lw: 1.6, frame: 'shadow', r: 8, bw: 3,
               tones: { feed: ['#ffd23f', '#9f3c24'], play: ['#d63a2a', '#fffbe8', '#16120f'], sleep: ['#fffbe8'], clean: ['#16120f', '#ffd23f'], heart: ['#d63a2a'], bug: ['#2f6a24', '#16120f'] } },
  ukiyoe:    { font: SERIF, fs: 1.1, ink: '#1a2238', lw: .8, frame: 'seal',
               tones: { feed: ['#e2b437', '#93402a'], play: ['#3a62a0', '#f6f1e4', '#1d3866'], sleep: ['#f6f1e4'], clean: ['#1a2238', '#e2b437'], heart: ['#b8322a'], bug: ['#1d3866', '#b8322a'] } },
  kamon:     { font: SERIF, fs: 1.1, ink: '#1a1816', lw: 1.1, frame: 'thin', dark: '#8a8372',
               tones: { feed: ['#eee7d7', '#1a1816'], play: ['#eee7d7', '#1a1816', '#1a1816'], sleep: ['#eee7d7'], clean: ['#eee7d7', '#eee7d7'], heart: ['#eee7d7'], bug: ['#eee7d7', '#1a1816'] } },
};
const STYLE = () => STY[S.look] || STY.original;
const lookInfo = () => LOOKS.find(l => l.name === S.look) || LOOKS[1];
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.3 * (n >> 16) + 0.59 * ((n >> 8) & 255) + 0.11 * (n & 255)) / 255; };
function ui() {
  const L = lookInfo();
  const dark = lum(L.ink) < lum(L.card) ? L.ink : L.card;
  const light = dark === L.ink ? L.card : L.ink;
  // card/ink: a panel and its text; bg/fg: translucent strips over the scenery
  return { card: L.card, ink: L.ink, bg: dark, fg: light, acc: lum(L.accent) > 0.3 && L.accent !== dark ? L.accent : '#D97757' };
}

// icons: shapes in a 16 x 16 box, [role] indexes the style's tones
const SHAPES = {
  feed:  [{ t: 'c', a: [8, 8, 7], r: 0 }, { t: 'c', a: [5, 5.5, 1.3], r: 1, n: 1 }, { t: 'c', a: [10.5, 6, 1.3], r: 1, n: 1 }, { t: 'c', a: [7, 10.5, 1.3], r: 1, n: 1 }, { t: 'c', a: [11.2, 11, 1.1], r: 1, n: 1 }, { t: 'c', a: [4.5, 9.8, 1], r: 1, n: 1 }],
  play:  [{ t: 'c', a: [8, 8, 7], r: 0 }, { t: 'p', d: 'M1.4 8.5 Q8 3 14.6 8.5', r: 1, s: 1.6 }, { t: 'c', a: [5.5, 5, 1.4], r: 1, n: 1 }],
  sleep: [{ t: 'p', d: 'M10 1 A7 7 0 1 0 15 11 A5.5 5.5 0 1 1 10 1Z', r: 0 }],
  clean: [{ t: 'l', a: [13, 2, 7, 9], r: 0, s: 2.2 }, { t: 'p', d: 'M3.5 9 L10 8 L13 14.5 L2 14.5Z', r: 1 }],
  heart: [{ t: 'p', d: 'M8 14.5 C-1 8 2 1.5 8 5 C14 1.5 17 8 8 14.5Z', r: 0 }],
  bug:   [{ t: 'e', a: [7.5, 9, 5.5, 3.8], r: 0 }, { t: 'c', a: [13.3, 9, 2.3], r: 1 }, { t: 'l', a: [4, 12, 3, 15], r: 1, s: 1.2 }, { t: 'l', a: [8, 12.5, 8, 15.5], r: 1, s: 1.2 }, { t: 'l', a: [11, 12, 12, 15], r: 1, s: 1.2 }, { t: 'l', a: [14, 7, 15.5, 4], r: 1, s: 1 }],
};
// accessories share the icon pipeline, so they take on the style too; roles: 0 main, 1 gold, 2 accent, 3 light, 4 dark
Object.assign(SHAPES, {
  hat1: [{ t: 'p', d: 'M8 .5 L13.5 14 L2.5 14Z', r: 0 }, { t: 'p', d: 'M6.2 9 L9.8 9 L11 12 L5 12Z', r: 1 }, { t: 'c', a: [8, 1.3, 1.7], r: 2 }],
  hat2: [{ t: 'p', d: 'M1 13 L15 13 L15 14.8 L1 14.8Z', r: 4 }, { t: 'p', d: 'M3.5 2 L12.5 2 L12.5 13 L3.5 13Z', r: 4 }, { t: 'p', d: 'M3.5 9.6 L12.5 9.6 L12.5 12 L3.5 12Z', r: 2 }],
  hat3: [{ t: 'p', d: 'M1.5 14 L1.5 5 L5 9 L8 3 L11 9 L14.5 5 L14.5 14Z', r: 1 }, { t: 'c', a: [8, 11, 1.2], r: 2, n: 1 }, { t: 'c', a: [4.2, 11.6, 1], r: 0, n: 1 }, { t: 'c', a: [11.8, 11.6, 1], r: 0, n: 1 }],
  hat4: [{ t: 'p', d: 'M2 14 Q2 3.5 8 3.5 Q14 3.5 14 14Z', r: 0 }, { t: 'p', d: 'M1.5 11 L14.5 11 L14.5 14.5 L1.5 14.5Z', r: 3 }, { t: 'c', a: [8, 2.6, 2], r: 2 }],
  hat5: [{ t: 'p', d: 'M3 14 Q3 7.5 8 7.5 Q13 7.5 13 14Z', r: 2 }, { t: 'l', a: [8, 7.5, 8, 4.8], r: 4, s: 1.2 }, { t: 'e', a: [4.2, 4.4, 3.6, 1.1], r: 0 }, { t: 'e', a: [11.8, 4.4, 3.6, 1.1], r: 1 }, { t: 'c', a: [8, 4.7, 1], r: 4, n: 1 }],
  face1: [{ t: 'c', a: [4.2, 8, 2.8], r: 4, s: 1 }, { t: 'c', a: [11.8, 8, 2.8], r: 4, s: 1 }, { t: 'l', a: [7, 7.6, 9, 7.6], r: 4, s: .9 }],
  face2: [{ t: 'p', d: 'M1.7 5.9 L6.7 5.9 L6.4 9.5 Q5.6 10.9 4.2 10.9 Q2.5 10.9 1.9 9.3Z', r: 4 }, { t: 'p', d: 'M9.3 5.9 L14.3 5.9 L14.1 9.3 Q13.5 10.9 11.8 10.9 Q10.4 10.9 9.6 9.5Z', r: 4 }, { t: 'l', a: [6.6, 6.5, 9.4, 6.5], r: 4, s: 1.1 }, { t: 'l', a: [2.7, 7.3, 3.7, 6.8], r: 3, s: .8 }],
  face3: [{ t: 'p', d: 'M8 6.6 Q6.2 5 3.8 5.7 Q1.8 6.6 2.6 8.6 Q4.4 7.2 8 8.4 Q11.6 7.2 13.4 8.6 Q14.2 6.6 12.2 5.7 Q9.8 5 8 6.6Z', r: 4 }],
  body1: [{ t: 'p', d: 'M8 8 L1.5 3.5 L1.5 12.5Z', r: 2 }, { t: 'p', d: 'M8 8 L14.5 3.5 L14.5 12.5Z', r: 2 }, { t: 'c', a: [8, 8, 1.9], r: 0 }],
  body2: [{ t: 'p', d: 'M10 9 L14 9.6 L13.4 15 L9.4 14.4Z', r: 0 }, { t: 'p', d: 'M.8 4.4 Q8 8.4 15.2 4.4 L15.2 10 Q8 14 .8 10Z', r: 2 }],
});
const ACC = n => /^(hat|face|body)\d$/.test(n);
const accTones = st => { const t = st.tones; const dark = st.dark || (lum(st.ink) < .45 ? st.ink : (t.play[2] || t.feed[1])); return [t.play[0], t.feed[0], t.heart[0], t.sleep[0], dark]; };
const shade = (hex, t) => { const n = parseInt(hex.slice(1), 16), f = t > 0 ? 255 : 0, a = Math.abs(t); const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (f - v) * a)); return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); };
const ICACHE = {};
function iconCanvas(name, size) {

    else { g.strokeStyle = 'rgba(28,22,17,.45)'; g.lineWidth = .5; for (let i = -16; i < 32; i += 1.6) { g.beginPath(); g.moveTo(i, 16); g.lineTo(i + 16, 0); g.stroke(); } }

        og.fillRect(x * cell + gap, y * cell + gap, cell - gap * 2, cell - gap * 2);
      }

}
function icon(name, x, y, size, flip) {

  else ctx.drawImage(im, Math.round(x), Math.round(y), size, size);

function musicTick() {

function tapReact() {

  if (R.mode === 'dizzy') return;
  R.taps = R.taps.filter(t => R.time - t < 1.4); R.taps.push(R.time);
  if (R.taps.length >= 4) { R.taps = []; setMode('dizzy'); return say('Hör auf, mir wird schwindlig!', 2); }
  hearts(1);
  if (S.calm) return startAct(Math.random() < .5 ? 'happy' : 'wave', 1.4, pick(['Hihi!', 'Hallo!']));
  const r = Math.random();
  if (r < .3) startAct('wave', 1.6, pick(['Hallo!', 'Hi!', 'Na du!']));
  else if (r < .55) startAct('happy', 1.4, pick(['Hihi!', 'Kitzelt!', 'Mehr!']));
  else if (r < .75) startAct('spin', 1.2, 'Wheee!');
  else if (r < .9) startAct('celebrate', 1.4, 'Juhu!');

}

// pickers: each column is an endless drum (rolodex) that rolls to its value

  games: [
    { label: 'Spiel', list: () => ['Ball', 'Seilspringen', 'Pfeifen'], get: () => R.gameSel, set: i => { R.gameSel = i; } },
  ],
  world: [
    { label: 'Ort', list: () => SCENES.map(k => SCENE_DE[k]), get: () => SCENES.indexOf(S.scene), set: i => { S.scene = SCENES[i]; loadWorld(); } },
    { label: 'Stil', list: () => LOOKS.map(l => LOOK_DE[l.name] || l.name), get: () => LOOKS.findIndex(l => l.name === S.look), set: i => { S.look = LOOKS[i].name; loadWorld(); } },
    { label: 'Zeit', list: () => ['Echtzeit', 'Aus'], get: () => (S.tod ? 0 : 1), set: i => { S.tod = i === 0; R.tod = todPeriod(hourNow()); } },
  ],
  options: [
    { label: 'Klang', list: () => ['Stil', 'Retro', 'Glocken', 'Minimal'], get: () => S.pack, set: i => { S.pack = i; audioUnlock(); snd('preview'); } },
    { label: 'Laut', list: () => ['Aus', '25 %', '50 %', '75 %', '100 %'], get: () => S.vol, set: i => { S.vol = i; audioUnlock(); applyAudio(); snd('preview'); } },
    { label: 'Ruhe', list: () => ['Aus', '22–07', '23–08', '00–06'], get: () => S.quiet, set: i => { S.quiet = i; applyAudio(); } },
    { label: 'Bewegung', list: () => ['Normal', 'Ruhig'], get: () => S.calm, set: i => { S.calm = i; if (i) R.amb = []; else makeAmbient(); } },
  ],
  items: [
    { label: 'Kopf', list: () => HATS, get: () => S.hat, set: i => { S.hat = i; } },
    { label: 'Gesicht', list: () => FACES, get: () => S.face, set: i => { S.face = i; } },
    { label: 'Körper', list: () => BODIES, get: () => S.body, set: i => { S.body = i; } },
  ],
};
const mod = (v, n) => ((v % n) + n) % n;
function openPanel(name) { R.brkKey = ''; R.panel = name; R.prow = 0; R.pk = PANELS[name].map(c => { const g = c.get(); return { pos: g, idx: g, from: g, q: [], anim: null }; }); }
// every click of the wheel rolls one card and clicks into place (a little overshoot, then a short rest) before the next one rolls
function rollTo(col, steps) {
  const k = R.pk[col], dir = steps < 0 ? -1 : 1;
  for (let i = 0; i < Math.abs(steps) && k.q.length < 5; i++) k.q.push(dir);
  if (!k.anim) nextStep(col);
}
function nextStep(col) {
  const k = R.pk[col], c = PANELS[R.panel][col], dir = k.q.shift();
  if (!dir) { k.anim = null; return; }
  k.from = k.pos; k.idx += dir; snd('tick');
  c.set(mod(k.idx, c.list().length)); saveSoon();
  k.anim = { t: 0, dur: k.q.length > 1 ? .12 : .2, hold: .07 };
}
const easeOutBack = u => { const c = 1.9, v = u - 1; return 1 + (c + 1) * v * v * v + c * v * v; };   // ~8 % overshoot, then settles
function rollUpdate(dt) {
  R.pk.forEach((k, col) => {
    const a = k.anim; if (!a) return;
    a.t += dt;
    if (a.t < a.dur) k.pos = k.from + (k.idx - k.from) * easeOutBack(a.t / a.dur);
    else { k.pos = k.idx; if (a.t >= a.dur + a.hold) nextStep(col); }
  });
}
const changePanel = dir => rollTo(R.prow, dir);
function startGame(i) {
  if (busyNow() || R.sleeping) return;
  if (i === 0) setMode('play', { bounces: 0, cx: R.x });
  else if (i === 1) setMode('rope', { jumps: 0 });
  else whistle();
}
function whistle() {
  const d = snd('whistle') || 2.4;
  startAct('whistle', Math.max(2.4, d + .3));
  for (let i = 0; i < 4; i++) setTimeout(() => R.P.push({ kind: 'note', x: R.x + 26 + (i % 2) * 8, y: feetY() - 80, vx: 14, vy: -22, life: 1.4 }), i * 550);
}
function closePanel() { R.brkKey = ''; R.panel = null; R.menuOn = false; touched(); saveSoon(); }

// ---------- update ----------
function update(dt) {
  R.time += dt; R.t += dt; R.ox = 0;
  R.dim += ((R.sleeping ? 0.5 : 0) - R.dim) * Math.min(1, dt * 3);
  if (R.say) { R.say.t += dt; if (R.say.t > R.say.dur) R.say = null; }
  if (R.greet > 0) R.greet -= dt;
  R.shakeCool -= dt; R.jerk *= 0.9;
  updateAmbient(dt);
  R.todT += dt;
  if (R.todT > 20) {                                   // the real clock moves on: Clawd notices
    R.todT = 0;
    const p = todPeriod(hourNow());
    if (p !== R.tod) {
      R.tod = p;
      if (S.tod && ready && !R.panel && R.mode !== 'play' && R.mode !== 'rope') {
        if (R.sleeping && p === 'morning') { wake(false); say('Guten Morgen!', 2.5); }
        else if (!R.sleeping) { say({ morning: 'Guten Morgen!', day: 'Guten Tag!', evening: 'Guten Abend!', night: 'Gähn… Schlafenszeit?' }[p], 3); if (p === 'morning') startAct('wave', 1.6); }
      }
    }
  }
  R.P = R.P.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; return (p.life -= dt) > 0; });
  if (petting()) R.lastTouch = R.time;
  // the camera follows only when Clawd gets near the edge of the screen, so he really walks across the scenery
  const sx = R.x - R.cam;
  if (sx < 70) R.cam = R.x - 70; else if (sx > W - 70) R.cam = R.x - (W - 70);
  // the world is endless: the scenery repeats (mirrored, so there is no seam), so keep the numbers small by shifting whole periods
  const per = 2 * WORLD, kk = Math.floor(R.cam / per);
  if (Math.abs(kk) >= 2) { R.x -= kk * per; R.cam -= kk * per; R.target -= kk * per; if (R.cx != null) R.cx -= kk * per; }
  if (R.menuOn && R.time - R.menuT > 5) R.menuOn = false;
  // the drums roll to their values
  if (R.panel) rollUpdate(dt);
  if (R.brkT) { const e = Math.min(1, dt * 16); R.brk.l += (R.brkT.l - R.brk.l) * e; R.brk.r += (R.brkT.r - R.brk.r) * e; R.brk.y = R.brkT.y; }
  if (!ready || R.panel) return;

  const m = R.mode, fy = feetY();
  if (m === 'idle' || m === 'walk') {
    if (petting()) {
      if (m === 'walk') idle(1);
      R.petHeart -= dt;
      if (R.petHeart <= 0) { R.petHeart = .45; hearts(1); }
      return;
    }
  }
  if (m === 'idle') {
    R.wait -= dt;
    if (R.time - R.lastTouch > todSleepAfter()) { R.sleeping = true; setMode('sleep'); return say(tod() === 'night' ? 'Gute Nacht…' : 'zZz…'); }   // nobody around: he dozes off, sooner at night
    if (R.wait <= 0) {
      if (Math.random() < .3) say(oneQuip());
      R.wait = rnd(1.5, 4) * todWait() * (S.calm ? 1.5 : 1);
      let list = ACTS[tod()]; if (S.calm) list = list.filter(([a]) => a === 'walk' || a === 'happy');
      let r = Math.random() * list.reduce((n, [, w]) => n + w, 0), act = 'walk';
      for (const [a, w] of list) { if ((r -= w) < 0) { act = a; break; } }
      if (act === 'walk') {
        R.target = R.x + (Math.random() < .5 ? -1 : 1) * rnd(90, 280);
        R.fast = false; setMode('walk');
      } else if (act === 'rope') setMode('rope', { jumps: 0 });
      else if (act === 'whistle') whistle();
      else if (act === 'shrug') startAct('shrug', 1.8, tod() === 'night' ? 'Gähn…' : '…?');
      else startAct(act, act === 'dance' ? 2 : act === 'spin' ? 1.2 : act === 'wave' ? 1.6 : 1.4);
    }
  } else if (m === 'walk') {
    const d = R.target - R.x;
    R.look = Math.sign(d) || R.look;
    R.x += Math.sign(d) * Math.min(Math.abs(d), (R.fast ? 80 : 36 * todSpeed() * (S.calm ? .75 : 1)) * dt);
    if (Math.abs(d) < 1.5) { R.fast = false; idle(); }
  } else if (m === 'act') {
    if (R.t > R.act.dur) idle(1.2);
  } else if (m === 'play') {
    const bn = Math.floor(R.t / .7); if (bn !== R.bn) { R.bn = bn; snd('bounce'); }
    const nx = R.cx + Math.sin(R.t * 1.5) * 60;
    R.look = Math.sign(nx - R.x) || R.look; R.x = nx;
    if (R.t >= 4.2) { say('Das war toll!'); startAct('happy', 1.4); }
  } else if (m === 'rope') {
    const j = Math.floor(R.t / .7);
    if (j !== R.jumps) { R.jumps = j; snd('land'); if (j > 0) R.P.push({ kind: 'text', text: String(j), s: 11, x: R.x + 22, y: fy - 100, vx: 6, vy: -22, life: 1 }); }
    if (R.t >= 5.6) { say('Geschafft!'); startAct('happy', 1.4); }
  } else if (m === 'sleep') {
    if (R.time - R.lastSnore > 2.9) { R.lastSnore = R.time; snd('snore'); }
    if (Math.floor(R.t) !== Math.floor(R.t - dt))
      R.P.push({ kind: 'text', text: 'Z', s: 10 + Math.floor(Math.random() * 5), x: R.x + 14, y: fy - 92, vx: 8, vy: -14, life: 2 });
  } else if (m === 'dizzy') {
    R.ox = Math.sin(R.t * 12) * 2;
    if (R.t > 1.8) idle(1.5);
  }
}

// ---------- drawing ----------
function animFor() {
  const m = R.mode;
  if (R.sleeping || m === 'sleep') return 'sleep';
  if (m === 'dizzy') return 'dizzy';
  if (m === 'act') return R.act.anim;
  if (m === 'play') return 'dance';
  if (m === 'rope') return 'rope';
  if (petting()) return 'pet';
  if (m === 'walk') return 'walk';
  if (R.greet > 0) return 'wave';
  return 'idle';
}

function drawClawd() {
  if (!R.sheet) return;
  const name = animFor(), mo = MANI.motions[name], cam = R.cam;
  if (name !== R.anim) { R.anim = name; R.animT0 = R.time; }
  const frame = Math.floor((((R.time - R.animT0) / mo.dur) % 1) * mo.frames);
  const dw = CELLW * K, dh = CELLH * K;
  const sx = R.x + R.ox - cam, fy = feetY();
  const baseY = fy - (MANI.ch - 6) * MANI.scale * K;
  ctx.imageSmoothingEnabled = S.look !== 'pixel';
  ctx.save();
  ctx.translate(Math.round(sx), 0);
  if (R.look < 0) ctx.scale(-1, 1);
  ctx.drawImage(R.sheet, frame * CELLW, mo.row * CELLH, CELLW, CELLH, Math.round(-dw / 2), Math.round(baseY), Math.round(dw), Math.round(dh));
  // accessories ride on the baked anchors of this very frame: head top, eyes, body
  const [hx, hy, bw, bh, ex, ey, ed, ang, vis] = MANI.anchors[name][frame];
  const at = (ax, ay, a, size, nm, ox, oy) => {
    ctx.save(); ctx.translate((ax - CELLW / 2) * K, baseY + ay * K); ctx.rotate(a);
    ctx.drawImage(iconCanvas(nm, Math.round(size)), -size / 2 + (ox || 0), -size / 2 + (oy || 0), size, size);
    ctx.restore();
  };
  if (S.body) at(hx, hy + bh * .72, vis ? ang : 0, bw * K * .42, 'body' + S.body);
  if (S.face && vis) at(ex, ey + (S.face === 3 ? ed * .55 : 0), ang, ed * K * (S.face === 3 ? 1.15 : 2.1), 'face' + S.face);
  if (S.hat) { const size = bw * K * .72; at(hx, hy, vis ? ang : 0, size, 'hat' + S.hat, 0, -size * (14 / 16 - .5) + size * .06); }
  ctx.restore();
  return { top: baseY + 36 * K - (name === 'celebrate' ? 14 : 0) - (S.hat ? bw * K * .6 : 0), sx, hx: (bw / 2 + 14) * K, hy: baseY + (hy + bh * .5) * K, dur: mo.dur, u: (((R.time - R.animT0) / mo.dur) % 1 + 1) % 1 };
}

function drawParticles(cam) {
  for (const p of R.P) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    if (p.kind === 'heart') icon('heart', p.x - cam - 6, p.y - 6, 12);
    else if (p.kind === 'note') { const x = p.x - cam, y = p.y; for (const [dx, dy, c] of [[1, 1, '#1d1a2e'], [0, 0, '#fff']]) { rect(x + dx, y + 5 + dy, 5, 4, c); rect(x + 4 + dx, y + dy, 1.5, 7, c); rect(x + 4 + dx, y + dy, 4, 1.5, c); } }
    else if (p.kind === 'text') {
      ctx.font = fontStr(p.s); ctx.textBaseline = 'middle';
      ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1a2e'; ctx.strokeText(p.text, p.x - cam, p.y);
      ctx.fillStyle = '#f6f1e2'; ctx.fillText(p.text, p.x - cam, p.y);
    } else rect(p.x - cam, p.y, p.s, p.s, p.col);
  }
  ctx.globalAlpha = 1;
}

function drawBubble(c) {
  if (!R.say || !c) return;
  const u = ui(), size = 9, text = R.say.text;
  const w = textW(text, size) + 16, h = 20;
  const bx = clamp(c.sx - w / 2, INL + 4, W - INR - w - 4), by = Math.max(TOP + 4, c.top - h - 8);
  box(bx, by, w, h);
  const tx = clamp(c.sx, bx + 8, bx + w - 8);
  ctx.fillStyle = u.card; ctx.strokeStyle = STYLE().stroke || u.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(tx - 4, by + h - 1); ctx.lineTo(tx, by + h + 6); ctx.lineTo(tx + 4, by + h - 1); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 4, by + h); ctx.lineTo(tx, by + h + 6); ctx.lineTo(tx + 4, by + h); ctx.stroke();
  ctx.fillStyle = u.card; ctx.fillRect(tx - 3, by + h - 2, 7, 3);
  txt(text, bx + w / 2, by + h / 2 + 1, { size, fill: u.ink, align: 'center' });
}

const MENU_LABELS = () => ['Spiel', R.sleeping ? 'Wecken' : 'Schlaf', 'Items', 'Welt', 'Optionen'];
// [ ] mark what the wheel is on; they slide from one option to the next
function brackets(key, l, r, y) {
  R.brkT = { l, r, y };
  if (R.brkKey !== key) { R.brkKey = key; R.brk = { l, r, y }; }
  const b = R.brk;
  txt('[', b.l, b.y, { size: 10, halo: true, align: 'center' });
  txt(']', b.r, b.y, { size: 10, halo: true, align: 'center' });
}
function drawMenu() {
  strip(0, MENU_Y, W, H - MENU_Y);
  const busy = !R.sleeping && busyNow(), labels = MENU_LABELS();
  for (let i = 0; i < 5; i++) {
    const x = INL + i * ITEM_W, sel = R.menuOn && i === R.sel;
    txt(labels[i], x + ITEM_W / 2, MENU_Y + MENU_H / 2, { size: 9, maxW: ITEM_W - 8, halo: true, align: 'center', alpha: busy && i < 2 ? .4 : 1 });
    if (sel) { const hw = Math.min(textW(labels[i], 9), ITEM_W - 8) / 2 + 5; brackets('menu', x + ITEM_W / 2 - hw, x + ITEM_W / 2 + hw, MENU_Y + MENU_H / 2); }
  }
  if (!R.menuOn) R.brkKey = '';
}

// the picker: in the menu's strip, as text on strips: "Ort Wald  Stil Kupferstich"; [ ] mark the option the wheel is on, which rolls like a rolodex card
function drawPanel() {
  const cols = PANELS[R.panel], uw = W - INL - INR, cw = uw / cols.length, one = cols.length <= 2;
  strip(0, PY, W, H - PY);
  cols.forEach((c, ci) => {
    const x0 = INL + ci * cw, on = ci === R.prow, k = R.pk[ci], list = c.list(), n = list.length, a = on ? 1 : .65;
    let ix0, ix1, cy;
    if (one) {                                   // label and value on one line
      txt(c.label, x0 + 10, PY + MENU_H / 2, { size: 8, halo: true, alpha: a * .8 });
      ix0 = x0 + 10 + textW(c.label, 8) + 12; ix1 = x0 + cw - 10; cy = PY + MENU_H / 2;
    } else { txt(c.label, x0 + cw / 2, PY + 9, { size: 7, halo: true, align: 'center', alpha: a * .8 }); ix0 = x0 + 12; ix1 = x0 + cw - 12; cy = PY + 25; }
    const mx = (ix0 + ix1) / 2;
    ctx.save(); ctx.beginPath(); ctx.rect(ix0, cy - 9, ix1 - ix0, 18); ctx.clip();       // cards roll in and out of the field only
    const base = Math.round(k.pos);
    for (let d = -1; d <= 1; d++) {
      const o = base + d - k.pos, ang = o * .95;
      if (Math.abs(ang) > 1.4) continue;
      const sc = Math.cos(ang), y = cy + Math.sin(ang) * 17;
      ctx.save(); ctx.translate(mx, y); ctx.scale(1, Math.max(.05, sc));
      txt(list[mod(base + d, n)], 0, 0, { size: 9.5, maxW: ix1 - ix0, halo: true, align: 'center', alpha: clamp(sc * 1.2, 0, 1) * a });
      ctx.restore();
    }
    ctx.restore();
    if (on) {
      const hw = Math.min(textW(list[mod(base, n)], 9.5), ix1 - ix0) / 2 + 8;
      brackets('panel' + R.panel, mx - hw, mx + hw, cy);
    }
  });
}

function draw() {
  const cam = R.cam;
  ctx.save(); ctx.translate(0, -Math.round(R.lift));
  // scenery over the full height
  if (R.bg) {
    ctx.imageSmoothingEnabled = S.look !== 'pixel';
    const iw = R.bg.naturalWidth, ih = R.bg.naturalHeight, y0 = BG_YOFF * iw / BGW, sh = ih - y0;
    // endless: the picture, then its mirror image, then the picture again, ...
    for (let t = Math.floor(R.cam / WORLD); t * WORLD < R.cam + W; t++) {
      const x0 = Math.round(t * WORLD - R.cam), w = Math.round((t + 1) * WORLD - R.cam) - x0, odd = ((t % 2) + 2) % 2 === 1;   // tiles abut exactly: no gap, no overlap
      if (odd) { ctx.save(); ctx.translate(x0 + w, 0); ctx.scale(-1, 1); ctx.drawImage(R.bg, 0, y0, iw, sh, 0, 0, w, H); ctx.restore(); }
      else ctx.drawImage(R.bg, 0, y0, iw, sh, x0, 0, w, H);
    }
  } else rect(0, 0, W, H, '#101018');

  const fy = feetY(), c = drawClawd();
  if (R.mode === 'play') {
    const T = .7, uu = (R.t % T) / T;
    icon('play', R.x - cam - 10, (c ? c.top : fy - 100) - 20 - Math.sin(Math.PI * uu) * 50, 20);   // above the head, hat included
  }
  if (R.mode === 'rope' && c) {               // the skipping rope: round the head, under the feet
    const ph = Math.cos(2 * Math.PI * c.u), reach = (fy - c.hy) * 2.3, cyc = c.hy - ph * reach * (ph > 0 ? .9 : 1);
    ctx.beginPath(); ctx.moveTo(c.sx - c.hx, c.hy); ctx.quadraticCurveTo(c.sx, cyc, c.sx + c.hx, c.hy);
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = STYLE().tones.feed[0]; ctx.lineWidth = 2; ctx.stroke();
  }
  drawParticles(cam);
  drawAmbient(cam);
  drawBubble(c);

  if (S.tod) {                                   // the scene follows the real time of day
    const [r, g, b, a] = tintAt(hourNow());
    if (a > .005) { ctx.globalAlpha = a; rect(0, 0, W, H + 80, 'rgb(' + [r, g, b].map(Math.round).join(',') + ')'); ctx.globalAlpha = 1; }
  }
  if (R.dim > .01) { ctx.globalAlpha = R.dim; rect(0, 0, W, H + 80, '#05060f'); ctx.globalAlpha = 1; }
  ctx.restore();
  if (R.panel) drawPanel(); else drawMenu();
  if (!R.bg || !R.sheet || !ready) {
    rect(0, 130, W, 24, '#000'); ctx.fillStyle = '#fff'; ctx.font = 'bold 10px ' + MONO;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText('Lade…', W / 2, 142); ctx.textAlign = 'left';
  }
}

let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (ts - lastTs < 33) return;        // ~30 fps is plenty
  const dt = Math.min(.1, (ts - lastTs) / 1000); lastTs = ts;
  update(dt); draw();
}

// ---------- storage (Base64, UTF-8 safe, creationStorage first, localStorage mirror) ----------
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s))));
const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(get, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { const v = get(); if (v) return v; await sleepMs(100); }
  return get() || null;
}
let CS = null;
async function loadState() {
  // SDK objects arrive late on the device: poll up to 3 s there, hardly wait on desktop
  CS = await waitFor(() => window.creationStorage && window.creationStorage.plain, /Android/i.test(navigator.userAgent) ? 3000 : 250);
  R.storageTag = CS ? 'cs' : 'ls';
  let raw = null;
  try { if (CS) raw = await CS.getItem(KEY); } catch (e) {}
  if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
  if (raw) { try { return dec(raw); } catch (e) {} }
  return null;
}
let saveTimer = 0;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow() {
  if (!ready) return;
  const s = enc(S);
  try { localStorage.setItem(KEY, s); } catch (e) {}
  try { if (CS) Promise.resolve(CS.setItem(KEY, s)).catch(() => {}); } catch (e) {}
}
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); if (AC) { if (document.hidden) AC.suspend(); else if (S.vol > 0) AC.resume(); } });

async function boot() {
  requestAnimationFrame(frame);
  loadWorld();                          // start fetching the default scenery right away
  const s = await loadState();
  if (s) {
    if (SCENES.includes(s.scene)) S.scene = s.scene;
    if (LOOKS.some(l => l.name === s.look)) S.look = s.look;
    if (s.hat >= 0 && s.hat < HATS.length) S.hat = s.hat | 0;
    if (s.face >= 0 && s.face < FACES.length) S.face = s.face | 0;
    if (s.body >= 0 && s.body < BODIES.length) S.body = s.body | 0;
    if (Number.isInteger(s.vol) && s.vol >= 0 && s.vol <= 4) S.vol = s.vol; else if (s.sound === false) S.vol = 0;
    for (const [k, n] of [['pack', 4], ['quiet', 4], ['calm', 2], ['tod', 2]]) if (Number.isInteger(s[k]) && s[k] >= 0 && s[k] < n) S[k] = s[k];
    if (Number.isFinite(s.born)) S.born = s.born;
    loadWorld();
  }
  R.tod = todPeriod(hourNow());
  say(!s ? 'Hallo, ich bin Clawd!' : S.tod ? TOD_HELLO[R.tod] : 'Hallo wieder!', 2.5);
  ready = true; R.lastTouch = R.time; saveNow();
  if (S.tod && R.tod === 'night' && Math.random() < .5) { R.sleeping = true; setMode('sleep'); say('zZz…', 2); }   // found him asleep
}

// ---------- input ----------
// wheel: steers Clawd left/right; after a side click it picks a menu item instead (a second click runs it)
function wheel(d) {
  touched(); audioUnlock();
  if (R.panel) return changePanel(d);
  if (R.menuOn) { R.sel = (R.sel + d + 5) % 5; R.menuT = R.time; return; }
  if (!ready) return;
  if (R.sleeping) return wake(false);
  if (R.mode === 'play' || R.mode === 'dizzy') return;
  const from = R.mode === 'walk' ? R.target : R.x;
  R.target = from - d * 40;                    // inverted: turning the wheel up walks right
  R.look = -d; R.fast = true;
  if (R.mode !== 'walk') setMode('walk');
}
window.addEventListener('scrollUp', () => wheel(-1));
window.addEventListener('scrollDown', () => wheel(1));
window.addEventListener('sideClick', () => {
  const n = performance.now();
  if (n - R.lastClick < 250) return;   // a double click arrives as two events ~50 ms apart
  R.lastClick = n; touched(); audioUnlock();
  if (R.panel) {
    if (R.prow < PANELS[R.panel].length - 1) R.prow++;
    else if (R.panel === 'games') { const g = R.gameSel; closePanel(); startGame(g); }
    else closePanel();
    return;
  }
  if (!R.menuOn) { R.menuOn = true; R.menuT = R.time; return; }
  R.menuOn = false; act(R.sel);
});
window.addEventListener('longPressStart', () => { touched(); audioUnlock(); if (R.panel) closePanel(); else if (R.sleeping) wake(false); else R.hold = true; });
window.addEventListener('longPressEnd', () => { R.hold = false; });

function pos(e) {
  const t = (e.touches && e.touches[0]) || e, r = cv.getBoundingClientRect();
  // the canvas may be turned: undo the rotation around its centre
  const a = rot * Math.PI / 180, dx = t.clientX - (r.left + r.width / 2), dy = t.clientY - (r.top + r.height / 2);
  return [dx * Math.cos(a) + dy * Math.sin(a) + W / 2, -dx * Math.sin(a) + dy * Math.cos(a) + H / 2];
}
function down(e) {
  e.preventDefault(); touched(); audioUnlock();
  const [x, y] = pos(e);
  if (R.panel) {
    if (y < PY) return closePanel();           // a tap above the picker closes it
    const cw = (W - INL - INR) / PANELS[R.panel].length;
    const col = clamp(Math.floor((x - INL) / cw), 0, PANELS[R.panel].length - 1);
    R.drag = { x, y, col, acc: 0, moved: false, was: R.prow === col };
    R.prow = col;
    return;
  }
  if (y >= MENU_Y) { R.sel = clamp(Math.floor((x - INL) / ITEM_W), 0, 4); act(R.sel); return; }
  const sx = R.x - R.cam, fy = feetY();
  if (Math.abs(x - sx) < 44 && y > fy - 100 && y < fy + 8) { R.touchPet = true; R.touchT = R.time; R.touchX = x; return; }
  // a tap on the scenery: Clawd walks over there
  if (R.sleeping) return wake(false);
  if (!busyNow() || R.mode === 'walk') { R.target = R.cam + x; R.fast = false; setMode('walk'); R.look = Math.sign(R.target - R.x) || R.look; }
}
function move(e) {
  if (!R.drag || !R.panel) return;
  e.preventDefault();
  const [, y] = pos(e), d = R.drag;
  while (Math.abs(y - d.y - d.acc) >= 18) {       // swipe up = next value, like turning a drum
    const dir = (y - d.y - d.acc) < 0 ? 1 : -1;
    d.acc += -dir * 18; d.moved = true; rollTo(d.col, dir);
  }
}
function up(e) {
  e.preventDefault();
  if (R.drag) {
    const d = R.drag; R.drag = null;
    if (!d.moved && d.was) rollTo(d.col, 1);       // a tap on the chosen column rolls it on; a first tap just selects it
    return;
  }
  if (R.touchPet && R.time - R.touchT <= .25) tapReact();
  R.touchPet = false;
}
document.body.addEventListener('touchstart', down, { passive: false });
document.body.addEventListener('touchmove', move, { passive: false });
document.body.addEventListener('mousemove', move);
document.body.addEventListener('touchend', up, { passive: false });
document.body.addEventListener('touchcancel', up, { passive: false });
document.body.addEventListener('mousedown', down);
document.body.addEventListener('mouseup', up);

// shake -> dizzy (wakes a sleeping Clawd, grumpily)
function onAccel(d) {
  orient(d);
  const x = d.tiltX ?? d.x ?? 0, y = d.tiltY ?? d.y ?? 0, z = d.tiltZ ?? d.z ?? 0;
  if (R.prev) R.jerk += Math.abs(x - R.prev[0]) + Math.abs(y - R.prev[1]) + Math.abs(z - R.prev[2]);
  R.prev = [x, y, z];
  if (R.jerk > 2.5 && R.shakeCool <= 0 && ready && !R.panel) {
    R.shakeCool = 4; R.jerk = 0; touched();
    if (R.sleeping) wake(true);
    else if (R.mode === 'idle' || R.mode === 'walk') { setMode('dizzy'); say('Uff… schwindlig'); }
  }
}
(async function initSensors() {
  try {
    const accel = await waitFor(() => window.creationSensors && window.creationSensors.accelerometer, 3000);
    if (accel && await accel.isAvailable()) accel.start(onAccel, { frequency: 30 });
    else window.addEventListener('devicemotion', e => { const g = e.accelerationIncludingGravity; if (g && g.x != null && g.y != null) orient({ x: g.x, y: g.y }); });
  } catch (e) {}
})();

// desktop preview shim: arrows = wheel, Enter/Space = side click, H = hold (pet)
if (typeof window.PluginMessageHandler === 'undefined') {
  const map = { ArrowUp: 'scrollUp', ArrowLeft: 'scrollUp', ArrowDown: 'scrollDown', ArrowRight: 'scrollDown', Enter: 'sideClick', ' ': 'sideClick' };
  window.addEventListener('keydown', e => {
    if (map[e.key]) { e.preventDefault(); window.dispatchEvent(new Event(map[e.key])); }
    else if (e.key === 'o' || e.key === 'O') setRot(rot + 90);   // preview: cycle the rotation
    else if ((e.key === 'h' || e.key === 'H') && !e.repeat) window.dispatchEvent(new Event('longPressStart'));
  });
  window.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') window.dispatchEvent(new Event('longPressEnd')); });
}

boot();
</script>
</body>
